<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude 技能构建完全指南</title>
<style>
  :root{
    --chrome:#1c1e24;
    --chrome-2:#24272e;
    --text:#e8eaf2;
    --text-2:#a6adc0;
    --text-3:#757b90;
    --line:rgba(255,255,255,.08);
    --accent:#7c8cff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--chrome);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    display:flex;flex-direction:column;
  }

  /* topbar */
  .topbar{
    height:56px;flex:none;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:var(--chrome-2);border-bottom:1px solid var(--line);z-index:20;
  }
  .topbar .logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;min-width:0}
  .topbar .logo span{color:var(--accent)}
  .topbar .logo small{font-weight:400;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .btn{
    background:none;border:1px solid var(--line);color:var(--text-2);border-radius:8px;
    padding:6px 12px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap;
  }
  .btn:hover{color:#fff;border-color:var(--accent);background:rgba(124,140,255,.08)}
  .btn.active{color:#fff;border-color:var(--accent);background:rgba(124,140,255,.16)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg .btn{border:none;border-radius:0;padding:6px 13px}
  .pageinfo{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:8px}
  .pageinfo b{color:#fff;min-width:2ch;text-align:center}

  /* main canvas */
  .canvas{flex:1;position:relative;overflow:hidden;background:#14161b;
    background-image:radial-gradient(1200px 600px at 50% -10%,rgba(124,140,255,.07),transparent 60%);}

  /* continuous mode */
  #continuous{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;display:none}
  #continuous.on{display:block}
  .cont-inner{max-width:900px;margin:0 auto;padding:34px 20px 90px}
  .pitem{background:#fff;border-radius:6px;box-shadow:0 10px 34px rgba(0,0,0,.5);margin-bottom:34px;position:relative}
  .pitem img{display:block;width:100%;height:auto}
  .pitem .plabel{
    position:absolute;bottom:8px;right:12px;font-size:11px;color:#9aa0b0;
    background:#fff;padding:0 8px;border-radius:5px;opacity:.85;
  }
  .cover-wrap{box-shadow:0 18px 50px rgba(0,0,0,.55)}

  /* single page mode */
  #single{position:absolute;inset:0;overflow:hidden;display:none}
  #single.on{display:flex;align-items:center;justify-content:center}
  #singleStage{max-width:92%;max-height:calc(100% - 40px);display:flex;align-items:center;justify-content:center}
  #singleStage img{max-width:100%;max-height:calc(100vh - 120px);width:auto;height:auto;background:#fff;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .25s}
  .navbtn{
    position:absolute;top:50%;transform:translateY(-50%);z-index:10;
    width:52px;height:76px;display:grid;place-items:center;border-radius:10px;
    background:rgba(20,22,27,.6);border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:26px;transition:.15s;backdrop-filter:blur(4px);
  }
  .navbtn:hover{background:rgba(124,140,255,.2);border-color:var(--accent)}
  .navbtn.prev{left:16px}.navbtn.next{right:16px}
  .hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-3)}
  .zoomctrl{position:absolute;bottom:16px;right:20px;display:flex;gap:6px;z-index:10}
  .zoomctrl .btn{background:rgba(20,22,27,.7);backdrop-filter:blur(4px)}

  /* grid overview */
  #grid{position:absolute;inset:0;overflow-y:auto;display:none;padding:30px 24px 80px}
  #grid.on{display:block}
  .grid-inner{max-width:1180px;margin:0 auto}
  .grid-inner h3{font-size:14px;color:var(--text-2);font-weight:600;margin:0 0 18px;letter-spacing:.3px}
  .gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
  .gitem{background:#fff;border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);position:relative;transition:transform .15s}
  .gitem:hover{transform:translateY(-3px);outline:2px solid var(--accent)}
  .gitem img{display:block;width:100%;height:auto}
  .gitem .n{position:absolute;top:6px;left:8px;font-size:11px;color:#666;background:rgba(255,255,255,.85);border-radius:4px;padding:0 6px}
  .gitem .pov{position:absolute;inset:0;top:50%;display:none;place-items:center;color:#333;font-size:12px;background:rgba(255,255,255,.86)}
  .gitem:hover .pov{display:grid}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-3)}

  @media(max-width:640px){
    .hide-m{display:none}
    .navbtn{width:40px;height:60px;font-size:20px}
    .navbtn.prev{left:6px}.navbtn.next{right:6px}
    .cont-inner{padding:16px 10px 70px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📘 Claude 技能构建 <span>完全指南</span>
    <small class="hide-m"> · 33 页 · 原版 PDF 排版还原</small>
  </div>
  <div class="spacer"></div>
  <div class="pageinfo hide-m" id="pageInfo"><b>1</b> / 33</div>
  <div class="seg">
    <button class="btn active" id="btnCont" title="连续滚动">连续</button>
    <button class="btn" id="btnSingle" title="单页阅读">单页</button>
    <button class="btn hide-m" id="btnGrid" title="缩略图总览">缩略图</button>
  </div>
  <button class="btn" id="btnFull" title="全屏">⛶</button>
</div>

<div class="canvas">
  <!-- continuous -->
  <div id="continuous">
    <div class="cont-inner" id="contInner"></div>
  </div>

  <!-- single -->
  <div id="single">
    <button class="navbtn prev" id="prev">‹</button>
    <div id="singleStage"></div>
    <button class="navbtn next" id="next">›</button>
    <div class="zoomctrl">
      <button class="btn" id="zin">＋</button>
      <button class="btn" id="zout">－</button>
      <button class="btn" id="zreset">100%</button>
    </div>
    <div class="hint">← → 方向键翻页 · 封面在上方</div>
  </div>

  <!-- grid -->
  <div id="grid">
    <div class="grid-inner">
      <h3 id="gridTitle"></h3>
      <div class="gwrap" id="gridWrap"></div>
    </div>
  </div>
</div>

<script>
  const PAGES = Array.from({length:33}, (_,i)=>`img/page-${String(i+1).padStart(2,'0')}.png`);
  const TOTAL = PAGES.length;

  const cont = document.getElementById('continuous');
  const contInner = document.getElementById('contInner');
  const single = document.getElementById('single');
  const singleStage = document.getElementById('singleStage');
  const grid = document.getElementById('grid');
  const gridWrap = document.getElementById('gridWrap');
  const gridTitle = document.getElementById('gridTitle');
  const pageInfo = document.getElementById('pageInfo');
  const btnCont = document.getElementById('btnCont');
  const btnSingle = document.getElementById('btnSingle');
  const btnGrid = document.getElementById('btnGrid');

  let mode = 'cont';
  let cur = 1;
  let zoom = 1;

  // build continuous
  const frag = document.createDocumentFragment();
  PAGES.forEach((src,i)=>{
    const it = document.createElement('div');
    it.className = 'pitem' + (i===0?' cover-wrap':'');
    const img = document.createElement('img');
    img.src = src; img.alt = '第 '+(i+1)+' 页'; img.loading='lazy';
    it.appendChild(img);
    const lb = document.createElement('div'); lb.className='plabel'; lb.textContent='第 '+(i+1)+' 页';
    it.appendChild(lb);
    frag.appendChild(it);
  });
  contInner.appendChild(frag);

  // build grid
  const gf = document.createDocumentFragment();
  PAGES.forEach((src,i)=>{
    const it = document.createElement('div'); it.className='gitem';
    const img = document.createElement('img'); img.src=src; img.alt='第 '+(i+1)+' 页'; img.loading='lazy';
    const n = document.createElement('div'); n.className='n'; n.textContent=(i+1);
    const pov = document.createElement('div'); pov.className='pov'; pov.textContent='第 '+(i+1)+' 页 · 查看';
    it.appendChild(img); it.appendChild(n); it.appendChild(pov);
    it.addEventListener('click',()=>goTo(i+1,'single'));
    gf.appendChild(it);
  });
  gridWrap.appendChild(gf);
  gridTitle.textContent = '共 '+TOTAL+' 页 · 点击任一页进入阅读';

  function show(m){
    mode = m;
    cont.classList.toggle('on', m==='cont');
    single.classList.toggle('on', m==='single');
    grid.classList.toggle('on', m==='grid');
    btnCont.classList.toggle('active', m==='cont');
    btnSingle.classList.toggle('active', m==='single');
    btnGrid.classList.toggle('active', m==='grid');
    if(m==='single') render();
  }

  function render(){
    pageInfo.innerHTML = '<b>'+cur+'</b> / '+TOTAL;
    singleStage.innerHTML='';
    const img=document.createElement('img');
    img.src=PAGES[cur-1]; img.alt='第 '+cur+' 页';
    img.style.transform='scale('+zoom+')';
    singleStage.appendChild(img);
  }

  function goTo(n, m){
    const target = m||mode;
    if(target==='grid') show('grid');
    cur = Math.max(1, Math.min(TOTAL, n));
    if(target==='cont'){
      show('cont');
      cont.scrollTo({top:0});
      const items = contInner.querySelectorAll('.pitem');
      if(items[cur-1]) items[cur-1].scrollIntoView({behavior:'smooth',block:'start'});
    } else if(target==='single'){
      show('single');
    }
  }

  function step(d){
    goTo(cur + d, 'single');
  }

  btnCont.onclick = ()=>{ show('cont'); };
  btnSingle.onclick = ()=>{ show('single'); };
  btnGrid.onclick = ()=>{ show('grid'); };
  document.getElementById('prev').onclick = ()=>step(-1);
  document.getElementById('next').onclick = ()=>step(1);

  document.getElementById('zin').onclick = ()=>{ zoom=Math.min(3, zoom+0.2); render(); };
  document.getElementById('zout').onclick = ()=>{ zoom=Math.max(0.4, zoom-0.2); render(); };
  document.getElementById('zreset').onclick = ()=>{ zoom=1; render(); };
  document.getElementById('btnFull').onclick = ()=>{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  };

  document.addEventListener('keydown', e=>{
    if(mode!=='single') return;
    if(e.key==='ArrowRight') step(1);
    else if(e.key==='ArrowLeft') step(-1);
    else if(e.key==='Escape' && document.fullscreenElement) document.exitFullscreen?.();
  });

  show('cont');
</script>
</body>
</html>
