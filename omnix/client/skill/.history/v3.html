<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能市场</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #18181b;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #f0f0f1;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .logo-box {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: #f4f4f5;
      display: flex; align-items: center; justify-content: center;
    }
    .header h1 { font-size: 18px; font-weight: 600; }

    .add-wrap { position: relative; }
    .btn-add {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-add:hover { background: #fafafa; }
    .dropdown {
      position: absolute; right: 0; top: calc(100% + 8px);
      width: 160px;
      background: #fff;
      border: 1px solid #f0f0f1;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.10);
      padding: 4px;
      z-index: 50;
    }
    .dropdown.hidden { display: none; }
    .dropdown button {
      width: 100%;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      font-size: 14px;
      text-align: left;
      background: none; border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #3f3f46;
    }
    .dropdown button:hover { background: #fafafa; }

    /* ---------- Toolbar ---------- */
    .toolbar {
      padding: 16px 24px;
    }
    .toolbar-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .tabs { display: flex; gap: 24px; border-bottom: 1px solid #f0f0f1; }
    .tab {
      padding-bottom: 12px;
      font-size: 14px;
      color: #71717a;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      color: #18181b; font-weight: 600;
      border-bottom-color: #18181b;
    }

    .toolbar-right { display: flex; align-items: center; gap: 12px; }
    .search-box { position: relative; }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #a1a1aa; }
    .search-box input {
      padding: 8px 16px 8px 36px;
      width: 256px;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .search-box input:focus { border-color: #d4d4d8; }

    .view-toggle { display: flex; border: 1px solid #e4e4e7; border-radius: 8px; overflow: hidden; }
    .view-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      font-size: 14px;
      background: #fff; color: #52525b;
      border: none; cursor: pointer;
    }
    .view-btn.active { background: #f4f4f5; color: #18181b; }

    /* ---------- Categories ---------- */
    .cats { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .cat {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 14px;
      color: #71717a;
      background: none; border: none; cursor: pointer;
      white-space: nowrap;
    }
    .cat.active { background: #f4f4f5; color: #18181b; font-weight: 500; }

    /* ---------- Main ---------- */
    main { padding: 8px 24px 48px; }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .grid-list { display: flex; flex-direction: column; gap: 12px; }
    @media (max-width: 768px) { .grid-cards { grid-template-columns: 1fr; } }

    .card {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      background: #fff;
      border: 1px solid #f0f0f1;
      border-radius: 16px;
      padding: 20px;
      transition: box-shadow .15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .grid-list .card { align-items: center; }

    .icon-box {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 16px; font-weight: 600; color: #18181b; }
    .card-desc {
      margin-top: 4px;
      font-size: 14px;
      color: #71717a;
      line-height: 1.5;
    }
    .clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      gap: 12px;
    }
    .grid-list .card-foot { margin-top: 0; flex-shrink: 0; }

    .stats { display: flex; align-items: center; gap: 16px; font-size: 14px; color: #a1a1aa; }
    .stat { display: inline-flex; align-items: center; gap: 4px; }

    .btn-install {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 999px;
      font-size: 14px; font-weight: 500;
      color: #3f3f46;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-install:hover { background: #fafafa; }
    .btn-try {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 999px;
      font-size: 14px; font-weight: 500;
      color: #3f3f46;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-try:hover { background: #fafafa; }

    /* 默认隐藏操作按钮，hover 卡片时淡入显示（保留占位避免布局抖动） */
    .btn-install, .btn-try {
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, background .15s ease;
    }
    .card:hover .btn-install,
    .card:hover .btn-try {
      opacity: 1;
      pointer-events: auto;
    }

    /* 安装中 / 已安装：常显不受 hover 影响 */
    .btn-install.loading,
    .btn-install.done {
      opacity: 1;
      pointer-events: auto;
      cursor: default;
    }
    .btn-install.done {
      color: #16a34a;
      border-color: #bbf7d0;
      background: #f0fdf4;
    }
    .spinner { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 顶部成功提示 Toast */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #18181b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---------- Upload Skill Modal ---------- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #fff;
      width: 480px; max-width: 90vw;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { font-size: 18px; font-weight: 600; }
    .modal-close {
      background: none; border: none; cursor: pointer;
      color: #a1a1aa; padding: 4px; display: flex;
      transition: color .15s;
    }
    .modal-close:hover { color: #18181b; }
    .upload-zone {
      border: 2px dashed #e5e5e5;
      border-radius: 12px;
      background: #f9fafb;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: #18181b;
      background: #f4f4f5;
    }
    .upload-icon { color: #a1a1aa; margin-bottom: 12px; display: flex; justify-content: center; }
    .upload-text { font-size: 14px; color: #52525b; }
    .file-requirements { margin-top: 20px; }
    .file-requirements h3 {
      font-size: 14px; font-weight: 600;
      color: #18181b; margin-bottom: 8px;
    }
    .file-requirements ul {
      list-style: disc; padding-left: 18px;
      font-size: 13px; color: #71717a; line-height: 1.7;
    }

    /* ---------- URL Install Modal ---------- */
    .modal.wide { width: 520px; }
    .modal-subtitle {
      font-size: 13px; color: #71717a;
      margin-bottom: 20px; line-height: 1.5;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 14px; color: #3f3f46;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 10px 12px;
      border: 1px solid #e4e4e7; border-radius: 8px;
      font-size: 14px; outline: none;
    }
    .form-group input:focus { border-color: #d4d4d8; }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: 12px;
      margin-top: 24px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 18px; border-radius: 8px;
      font-size: 14px; font-weight: 500;
      border: 1px solid transparent; cursor: pointer;
      transition: background .15s, border-color .15s, opacity .15s;
      min-width: 80px;
    }
    .btn.cancel {
      background: #fff; color: #3f3f46;
      border-color: #e4e4e7;
    }
    .btn.cancel:hover { background: #fafafa; }
    .btn.gray {
      background: #9ca3af; color: #fff;
      border-color: #9ca3af;
    }
    .btn.gray:hover { background: #8b95a1; }
    .btn.dark {
      background: #18181b; color: #fff;
      border-color: #18181b;
    }
    .btn.dark:hover { background: #3f3f46; }
    .btn:disabled { opacity: .65; cursor: not-allowed; }

    .preview-info { margin-bottom: 8px; }
    .info-row {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 0;
    }
    .info-label {
      width: 80px; flex-shrink: 0;
      font-size: 14px; color: #a1a1aa;
    }
    .badge.blue {
      display: inline-flex;
      background: #eff6ff; color: #3b82f6;
      padding: 2px 10px; border-radius: 999px;
      font-size: 13px; font-weight: 500;
    }
    .path.blue {
      background: #eff6ff; color: #3b82f6;
      padding: 4px 10px; border-radius: 6px;
      font-size: 13px;
    }
    .scan {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; color: #16a34a;
    }
    .dot.green {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
    }
    .file-list-title {
      font-size: 14px; font-weight: 600;
      color: #18181b; margin: 16px 0 8px;
    }
    .file-list {
      background: #f9fafb; border-radius: 10px;
      padding: 6px 0; list-style: none;
    }
    .file-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px; font-size: 13px; color: #3f3f46;
    }
    .file-item::before {
      content: "•"; color: #a1a1aa; margin-right: 8px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo-box">
        <svg class="icon-sm" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3f3f46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <h1>技能</h1>
    </div>

    <div class="add-wrap">
      <button class="btn-add" id="add-skill-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16m8-8H4"/></svg>
        添加技能
      </button>
      <div class="dropdown hidden" id="add-dropdown">
        <button id="btn-import">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          本地导入
        </button>
        <button id="btn-url">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
          从URL安装
        </button>
      </div>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-top">
      <nav class="tabs">
        <button class="tab active" data-tab="market">技能市场</button>
        <button class="tab" data-tab="builtin">系统内置</button>
        <button class="tab" data-tab="enterprise">企业技能</button>
        <button class="tab" data-tab="installed">已安装</button>
      </nav>

      <div class="toolbar-right">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" placeholder="搜索插件">
        </div>
        <div class="view-toggle">
          <button class="view-btn" data-view="list">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            列表
          </button>
          <button class="view-btn active" data-view="card">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            卡片
          </button>
        </div>
      </div>
    </div>

    <div class="cats">
      <button class="cat active" data-cat="ai">AI智能</button>
      <button class="cat" data-cat="dev">开发工具</button>
      <button class="cat" data-cat="efficiency">效率提升</button>
      <button class="cat" data-cat="data">数据分析</button>
      <button class="cat" data-cat="content">内容创作</button>
      <button class="cat" data-cat="security">安全合规</button>
      <button class="cat" data-cat="collab">通讯协作</button>
    </div>
  </div>

  <!-- Skills -->
  <main>
    <div id="skills-container" class="grid-cards"></div>
  </main>

  <div id="toast"></div>

  <!-- Upload Skill Modal -->
  <div class="modal-overlay hidden" id="upload-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>上传技能</h2>
        <button class="modal-close" id="modal-close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" accept=".zip,.md" hidden>
        <div class="upload-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><path d="M12 11v6"/><path d="M9 14l3-3 3 3"/></svg>
        </div>
        <p class="upload-text">拖拽文件 或 点击上传</p>
      </div>
      <div class="file-requirements">
        <h3>文件要求</h3>
        <ul>
          <li>文件或者 .zip 需要包含 SKILL.md 文件</li>
          <li>SKILL.md 文件需包含 YAML 格式的技能名称和描述</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- URL Install Modal -->
  <div class="modal-overlay hidden" id="url-install-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>从 URL 安装技能</h2>
        <button class="modal-close" id="url-close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="modal-subtitle">支持指向 SKILL.md 或技能压缩包的 URL，安装前会先展示安全预览。</p>
      <div class="form-group">
        <label>URL</label>
        <input type="text" id="url-input" placeholder="https://example.com/my-skill/SKILL.md">
      </div>
      <div class="form-group">
        <label>自定义技能名称（可选）</label>
        <input type="text" id="url-name" placeholder="输入技能名称">
      </div>
      <div class="modal-footer">
        <button class="btn cancel" id="url-cancel">取消</button>
        <button class="btn gray" id="url-preview">预览安装</button>
      </div>
    </div>
  </div>

  <!-- URL Install Preview Modal -->
  <div class="modal-overlay hidden" id="url-preview-modal">
    <div class="modal wide">
      <div class="modal-header">
        <h2>安装预览</h2>
        <button class="modal-close" id="preview-close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="modal-subtitle">安装「<span id="preview-skill-name">guizang-ppt-skill</span>」前，请确认安全扫描结果、目标路径和文件清单。</p>
      <div class="preview-info">
        <div class="info-row"><span class="info-label">技能名</span><span id="preview-name">guizang-ppt-skill</span></div>
        <div class="info-row"><span class="info-label">安装模式</span><span class="badge blue">新安装</span></div>
        <div class="info-row"><span class="info-label">安装路径</span><span class="path blue" id="preview-path">~/.skills/guizang-ppt-skill</span></div>
        <div class="info-row"><span class="info-label">扫描结论</span><span class="scan"><span class="dot green"></span>可安装</span></div>
      </div>
      <div class="file-list-title">文件清单 · 6 个文件</div>
      <ul class="file-list" id="preview-files"></ul>
      <div class="modal-footer">
        <button class="btn cancel" id="preview-cancel">取消</button>
        <button class="btn dark" id="preview-install">确认安装</button>
      </div>
    </div>
  </div>

  <script>
    const ICONS = {
      "document": '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>',

            '<span class="stat">' + DL_SVG + s.downloads + '</span>' +
          '</div>';

          : '<button class="btn-install" data-name="' + s.name + '">' + PLUS_SVG + '安装技能</button>';

          return '<div class="card">' + iconHtml +
                   '<div class="card-body">' + titleHtml + descHtml +

                   '</div>' +

          return '<div class="card">' + iconHtml +
                   '<div class="card-body">' + titleHtml + descHtml + '</div>' +
                   '<div class="card-foot">' + statsHtml + actionHtml + '</div>' +

        btn.classList.add("active");
        render();

    addBtn.addEventListener("click", e => {
      e.stopPropagation();
      dropdown.classList.toggle("hidden");

    document.addEventListener("click", e => {
      if (!addWrap.contains(e.target)) dropdown.classList.add("hidden");

    const skillContainer = document.getElementById("skills-container");
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
    }
    skillContainer.addEventListener("click", e => {
      const btn = e.target.closest(".btn-install");
      if (!btn) return;
      if (btn.classList.contains("loading") || btn.classList.contains("done")) return;
      const name = btn.getAttribute("data-name");
      btn.classList.add("loading");
      btn.innerHTML = '<svg class="spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 109 9"/></svg> 安装中';

        btn.classList.remove("loading");
        btn.classList.add("done");
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> 已安装';

      }, 1300);
    });

    // ---- Local import modal ----
    const modal = document.getElementById("upload-modal");

    const UPLOAD_ZONE_DEFAULT =
      '<input type="file" id="file-input" accept=".zip,.md" hidden>' +
      '<div class="upload-icon">' +
        '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><path d="M12 11v6"/><path d="M9 14l3-3 3 3"/></svg>' +
      '</div>' +
      '<p class="upload-text">拖拽文件 或 点击上传</p>';

    function openModal() {
      uploadZone.innerHTML = UPLOAD_ZONE_DEFAULT;
      modal.classList.remove("hidden");
      dropdown.classList.add("hidden");
    }
    function closeModal() {
      modal.classList.add("hidden");
      uploadZone.innerHTML = UPLOAD_ZONE_DEFAULT;
    }
    btnImport.addEventListener("click", openModal);
    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

    uploadZone.addEventListener("click", e => {
      if (e.target.id === "file-input") return;
      const input = uploadZone.querySelector("#file-input");
      if (input) input.click();
    });
    uploadZone.addEventListener("change", e => {
      if (e.target && e.target.id === "file-input") handleFile(e.target.files[0]);
    });

    ["dragenter","dragover","dragleave","drop"].forEach(evt => {
      uploadZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    ["dragenter","dragover"].forEach(evt => {
      uploadZone.addEventListener(evt, () => uploadZone.classList.add("dragover"), false);
    });
    ["dragleave","drop"].forEach(evt => {
      uploadZone.addEventListener(evt, () => uploadZone.classList.remove("dragover"), false);
    });
    uploadZone.addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));

    function handleFile(file) {
      if (!file) return;
      const name = file.name.replace(/\.(zip|md)$/i, "");
      uploadZone.innerHTML =
        '<svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 109 9"/></svg>' +

      setTimeout(() => {
        closeModal();
        showToast("技能 " + name + " 安装成功");
      }, 1500);
    }

    const urlCancel = document.getElementById("url-cancel");
    const urlPreviewBtn = document.getElementById("url-preview");
    const urlInput = document.getElementById("url-input");
    const urlNameInput = document.getElementById("url-name");

    const previewClose = document.getElementById("preview-close");
    const previewCancel = document.getElementById("preview-cancel");

    const previewSkillName = document.getElementById("preview-skill-name");
    const previewName = document.getElementById("preview-name");
    const previewPath = document.getElementById("preview-path");
    const previewFiles = document.getElementById("preview-files");

    const MOCK_FILES = [
      { name: "SKILL.md", size: "3.2 kB" },
      { name: "template.html", size: "12.8 kB" },
      { name: "styles/magazine.css", size: "3.6 kB" },

      { name: "manifest.json", size: "0.8 kB" }
    ];

    function openUrlInstall() {
      urlInput.value = "";
      urlNameInput.value = "";
      urlInstallModal.classList.remove("hidden");
      dropdown.classList.add("hidden");
      urlPreviewBtn.disabled = false;
      urlPreviewBtn.textContent = "预览安装";
    }
    function closeUrlInstall() { urlInstallModal.classList.add("hidden"); }
    function closeUrlPreview() { urlPreviewModal.classList.add("hidden"); }

    function extractSkillName(url) {
      try {
        const path = new URL(url).pathname;
        const seg = path.substring(path.lastIndexOf("/") + 1);
        return seg.replace(/\.(md|zip)$/i, "").replace(/[^a-zA-Z0-9_\u4e00-\u9fa5-]/g, "-") || "my-skill";
      } catch (e) {
        return "my-skill";
      }
    }

    function renderPreview(skillName) {
      const displayName = urlNameInput.value.trim() || skillName;
      previewSkillName.textContent = displayName;
      previewName.textContent = displayName;
      previewPath.textContent = "~/.skills/" + displayName;
      previewFiles.innerHTML = MOCK_FILES.map(f =>
        '<li class="file-item"><span>' + f.name + '</span><span style="color:#a1a1aa">' + f.size + '</span></li>'
      ).join("");
    }

    btnUrl.addEventListener("click", openUrlInstall);
    urlClose.addEventListener("click", closeUrlInstall);
    urlCancel.addEventListener("click", closeUrlInstall);
    urlInstallModal.addEventListener("click", e => { if (e.target === urlInstallModal) closeUrlInstall(); });

    urlPreviewBtn.addEventListener("click", () => {
      const url = urlInput.value.trim();
      if (!url) { urlInput.focus(); return; }
      const skillName = extractSkillName(url);
      renderPreview(skillName);
      urlInstallModal.classList.add("hidden");
      urlPreviewModal.classList.remove("hidden");
      previewInstall.disabled = false;
      previewInstall.innerHTML = "确认安装";
    });

    previewClose.addEventListener("click", closeUrlPreview);
    previewCancel.addEventListener("click", closeUrlPreview);
    urlPreviewModal.addEventListener("click", e => { if (e.target === urlPreviewModal) closeUrlPreview(); });

    previewInstall.addEventListener("click", () => {
      const name = previewName.textContent;
      previewInstall.disabled = true;
      previewInstall.innerHTML = '<svg class="spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 109 9"/></svg> 安装中';
      setTimeout(() => {
        closeUrlPreview();
        showToast("技能 " + name + " 安装成功");
      }, 1500);
    });

    // ---- Init ----
    render();
