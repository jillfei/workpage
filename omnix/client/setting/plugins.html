<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件 - OmniX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            min-height: 100vh;
            width: 100%;
        }

        /* 主内容区 */
        .main-content {
            padding: 32px 40px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .main-content-inner {
            width: 100%;
            max-width: 900px;
        }

        /* 主内容区 */
        .main-content {
            padding: 32px 40px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .main-content-inner {
            width: 100%;
            max-width: 900px;
        }

        /* 顶部标签 */
        .page-tab {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
            font-size: 14px;
            font-weight: 500;
            width: fit-content;
        }

        .page-tab svg {
            width: 16px;
            height: 16px;
            color: #666;
        }

        /* 内容区域 */
        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .content-inner {
            width: 100%;
            max-width: 800px;
        }

        /* 标题区域 */
        .hero-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .hero-subtitle {
            font-size: 14px;
            color: #999;
            line-height: 1.6;
        }

        /* 搜索框 */
        .search-wrapper {
            margin-bottom: 40px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        .search-input:focus {
            border-color: #333;
        }

        .search-input::placeholder {
            color: #ccc;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: #999;
        }

        /* 分类标题 */
        .category-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        /* 插件列表 */
        .plugin-list {
            margin-bottom: 32px;
        }

        .plugin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            margin-bottom: 12px;
            transition: box-shadow 0.2s;
        }

        .plugin-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .plugin-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .plugin-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .plugin-icon.blue {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .plugin-icon.green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .plugin-icon.orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .plugin-icon.chrome {
            background: #fff;
            border: 1px solid #e8e8e8;
        }

        .plugin-icon svg {
            width: 24px;
            height: 24px;
            color: #fff;
        }

        .plugin-icon.chrome svg {
            width: 28px;
            height: 28px;
        }

        .plugin-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .plugin-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plugin-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .plugin-badge {
            display: none;
            font-size: 11px;
            padding: 2px 6px;
            background: #e6f7ff;
            color: #1890ff;
            border-radius: 4px;
            font-weight: 500;
        }

        .plugin-badge.show {
            display: inline-block;
        }

        .plugin-desc {
            font-size: 12px;
            color: #999;
        }

        .plugin-add-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .plugin-add-btn:hover {
            border-color: #333;
            background: #f5f5f5;
        }

        .plugin-add-btn svg {
            width: 16px;
            height: 16px;
            color: #666;
        }

        .plugin-add-btn.installed {
            background: #e6f7ff;
            border-color: #91d5ff;
        }

        .plugin-add-btn.installed svg {
            color: #1890ff;
        }

        .plugin-add-btn.installed:hover {
            background: #fff2f0;
            border-color: #ffccc7;
        }

        .plugin-add-btn.installed:hover svg {
            color: #ff4d4f;
        }

        .plugin-remove-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #ffccc7;
            border-radius: 6px;
            background: #fff2f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .plugin-remove-btn:hover {
            background: #ff4d4f;
            border-color: #ff4d4f;
        }

        .plugin-remove-btn svg {
            width: 16px;
            height: 16px;
            color: #ff4d4f;
        }

        .plugin-remove-btn:hover svg {
            color: #fff;
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            max-width: 90%;
            transform: scale(0.9);
            transition: transform 0.2s;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            width: 24px;
            height: 24px;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            border-radius: 4px;
        }

        .modal-close:hover {
            background: #f5f5f5;
            color: #333;
        }

        .modal-body {
            margin-bottom: 24px;
        }

        .modal-body p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e0e0e0;
            background: #fff;
            color: #333;
        }

        .btn:hover {
            background: #f5f5f5;
        }

        .btn-primary {
            background: #1890ff;
            border-color: #1890ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #40a9ff;
            border-color: #40a9ff;
        }

        .btn-danger {
            background: #ff4d4f;
            border-color: #ff4d4f;
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff7875;
            border-color: #ff7875;
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #52c41a;
        }

        .toast.error {
            background: #ff4d4f;
        }

        .toast-icon {
            width: 16px;
            height: 16px;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 内容区域 -->
            <div class="content-wrapper">
                <div class="content-inner">
                    <!-- 标题区域 -->
                    <div class="hero-section">
                        <h1 class="hero-title">用插件，构建你的 AI 能力生态</h1>
                        <p class="hero-subtitle">自由安装与组合插件，让每一个智能体都拥有更强的工具和执行能力</p>
                    </div>

                    <!-- 搜索框 -->
                    <div class="search-wrapper">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="搜索插件" id="searchInput" oninput="filterPlugins()">
                    </div>

                    <!-- 桌面控制 -->
                    <div class="category-section">
                        <h2 class="category-title">桌面控制</h2>
                        <div class="plugin-list">
                            <div class="plugin-item" data-name="OmniBot Computer Use">
                                <div class="plugin-info">
                                    <div class="plugin-icon blue">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                            <line x1="8" y1="21" x2="16" y2="21"/>
                                            <line x1="12" y1="17" x2="12" y2="21"/>
                                        </svg>
                                    </div>
                                    <div class="plugin-details">
                                        <div class="plugin-name-row">
                                            <span class="plugin-name">OmniBot Computer Use</span>
                                            <span class="plugin-badge" data-plugin="OmniBot Computer Use">已安装</span>
                                        </div>
                                        <span class="plugin-desc">桌面控制未启用，开启后将允你完成 macOS 权限设置</span>
                                    </div>
                                </div>
                                <button class="plugin-add-btn" onclick="togglePlugin(this)" title="点击安装">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="5" x2="12" y2="19"/>
                                        <line x1="5" y1="12" x2="19" y2="12"/>
                                    </svg>
                                </button>
                            </div>

                            <div class="plugin-item" data-name="电子表格">
                                <div class="plugin-info">
                                    <div class="plugin-icon green">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                            <line x1="3" y1="9" x2="21" y2="9"/>
                                            <line x1="3" y1="15" x2="21" y2="15"/>
                                            <line x1="9" y1="3" x2="9" y2="21"/>
                                            <line x1="15" y1="3" x2="15" y2="21"/>
                                        </svg>
                                    </div>
                                    <div class="plugin-details">
                                        <div class="plugin-name-row">
                                            <span class="plugin-name">电子表格</span>
                                            <span class="plugin-badge" data-plugin="电子表格">已安装</span>
                                        </div>
                                        <span class="plugin-desc">创建和编辑电子表格文件</span>
                                    </div>
                                </div>
                                <button class="plugin-add-btn" onclick="togglePlugin(this)" title="点击安装">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="5" x2="12" y2="19"/>
                                        <line x1="5" y1="12" x2="19" y2="12"/>
                                    </svg>
                                </button>
                            </div>

                            <div class="plugin-item" data-name="演示文稿">
                                <div class="plugin-info">
                                    <div class="plugin-icon orange">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                            <polyline points="14 2 14 8 20 8"/>
                                            <line x1="16" y1="13" x2="8" y2="13"/>
                                            <line x1="16" y1="17" x2="8" y2="17"/>
                                            <polyline points="10 9 9 9 8 9"/>
                                        </svg>
                                    </div>
                                    <div class="plugin-details">
                                        <div class="plugin-name-row">
                                            <span class="plugin-name">演示文稿</span>
                                            <span class="plugin-badge" data-plugin="演示文稿">已安装</span>
                                        </div>
                                        <span class="plugin-desc">创建和编辑演示文稿</span>
                                    </div>
                                </div>
                                <button class="plugin-add-btn" onclick="togglePlugin(this)" title="点击安装">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="5" x2="12" y2="19"/>
                                        <line x1="5" y1="12" x2="19" y2="12"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 浏览器自动化 -->
                    <div class="category-section">
                        <h2 class="category-title">浏览器自动化</h2>
                        <div class="plugin-list">
                            <div class="plugin-item" data-name="Google Chrome 浏览器插件">
                                <div class="plugin-info">
                                    <div class="plugin-icon chrome">
                                        <svg viewBox="0 0 24 24" fill="none">
                                            <circle cx="12" cy="12" r="10" fill="#4285F4"/>
                                            <circle cx="12" cy="12" r="4" fill="#fff"/>
                                            <path d="M12 8L20 12L12 16" fill="#34A853"/>
                                            <path d="M12 8L4 12L12 16" fill="#EA4335"/>
                                            <path d="M12 16L20 12L12 8" fill="#FBBC05" opacity="0.8"/>
                                        </svg>
                                    </div>
                                    <div class="plugin-details">
                                        <div class="plugin-name-row">
                                            <span class="plugin-name">Google Chrome 浏览器插件</span>
                                            <span class="plugin-badge" data-plugin="Google Chrome 浏览器插件">已安装</span>
                                        </div>
                                        <span class="plugin-desc">需要注册浏览器扩展插件，请点击一键注册浏览器</span>
                                    </div>
                                </div>
                                <button class="plugin-add-btn" onclick="togglePlugin(this)" title="点击安装">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="5" x2="12" y2="19"/>
                                        <line x1="5" y1="12" x2="19" y2="12"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 安装确认弹窗 -->
    <div class="modal-overlay" id="installModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">安装插件</span>
                <button class="modal-close" onclick="closeModal('installModal')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p id="installModalContent">确定要安装该插件吗？</p>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('installModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmInstall()">确认安装</button>
            </div>
        </div>
    </div>

    <!-- 卸载确认弹窗 -->
    <div class="modal-overlay" id="uninstallModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">卸载插件</span>
                <button class="modal-close" onclick="closeModal('uninstallModal')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p id="uninstallModalContent">确定要卸载该插件吗？卸载后相关功能将无法使用。</p>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('uninstallModal')">取消</button>
                <button class="btn btn-danger" onclick="confirmUninstall()">确认卸载</button>
            </div>
        </div>
    </div>

    <!-- Toast提示 -->
    <div class="toast" id="toast">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        // 插件状态管理
        const pluginStates = {
            'OmniBot Computer Use': 'uninstalled',
            '电子表格': 'uninstalled',
            '演示文稿': 'uninstalled',
            'Google Chrome 浏览器插件': 'uninstalled'
        };

        let currentPlugin = null;
        let currentBtn = null;

        // 切换插件安装状态
        function togglePlugin(btn) {
            const pluginItem = btn.closest('.plugin-item');
            const pluginName = pluginItem.dataset.name;
            const state = pluginStates[pluginName];

            currentPlugin = pluginName;
            currentBtn = btn;

            if (state === 'uninstalled') {
                // 直接安装，不需要确认弹窗
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin">
                        <circle cx="12" cy="12" r="10" stroke-dasharray="30 60"/>
                    </svg>
                `;
                btn.disabled = true;

                setTimeout(() => {
                    pluginStates[currentPlugin] = 'installed';
                    updatePluginButton(currentBtn, 'installed');
                    currentBtn.disabled = false;
                    showToast(`"${currentPlugin}" 安装成功`, 'success');
                }, 800);
            } else {
                // 直接卸载，不需要确认弹窗
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin">
                        <circle cx="12" cy="12" r="10" stroke-dasharray="30 60"/>
                    </svg>
                `;
                btn.disabled = true;

                setTimeout(() => {
                    pluginStates[currentPlugin] = 'uninstalled';
                    updatePluginButton(currentBtn, 'uninstalled');
                    currentBtn.disabled = false;
                    showToast(`"${currentPlugin}" 已卸载`, 'success');
                }, 800);
            }
        }

        // 更新插件按钮状态
        function updatePluginButton(btn, state) {
            btn.classList.remove('added', 'installed', 'remove');
            
            const pluginItem = btn.closest('.plugin-item');
            const pluginName = pluginItem.dataset.name;
            const badge = pluginItem.querySelector('.plugin-badge');
            
            if (state === 'installed') {
                btn.className = 'plugin-remove-btn';
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18"/>
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                    </svg>
                `;
                btn.title = '点击拆卸';
                if (badge) badge.classList.add('show');
            } else {
                btn.className = 'plugin-add-btn';
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                `;
                btn.title = '点击安装';
                if (badge) badge.classList.remove('show');
            }
        }

        // 显示弹窗
        function showModal(modalId) {
            document.getElementById(modalId).classList.add('show');
        }

        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        // 显示Toast提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toast.className = 'toast ' + type;
            toastMessage.textContent = message;
            
            const icon = toast.querySelector('.toast-icon');
            if (type === 'success') {
                icon.innerHTML = `
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                `;
            } else {
                icon.innerHTML = `
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                `;
            }
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 搜索过滤插件
        function filterPlugins() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const plugins = document.querySelectorAll('.plugin-item');
            
            plugins.forEach(plugin => {
                const name = plugin.dataset.name.toLowerCase();
                const desc = plugin.querySelector('.plugin-desc').textContent.toLowerCase();
                
                if (name.includes(searchTerm) || desc.includes(searchTerm)) {
                    plugin.style.display = 'flex';
                } else {
                    plugin.style.display = 'none';
                }
            });

            document.querySelectorAll('.category-section').forEach(section => {
                const visiblePlugins = section.querySelectorAll('.plugin-item[style="display: flex;"], .plugin-item:not([style])');
                const hasVisible = Array.from(visiblePlugins).some(p => p.style.display !== 'none');
                
                if (searchTerm === '') {
                    section.style.display = 'block';
                } else {
                    section.style.display = hasVisible ? 'block' : 'none';
                }
            });
        }

        // 点击弹窗外部关闭
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });

        // 侧边栏导航切换
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
