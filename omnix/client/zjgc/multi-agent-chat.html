<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多智能体对话系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .conversation-area {
    flex: 1; overflow-y: auto; padding: 50px 24px 12px 24px; background: #fff;
  }
  .conversation-area::-webkit-scrollbar { width: 5px; }
  .conversation-area::-webkit-scrollbar-track { background: transparent; }
  .conversation-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 24px 40px; max-width: 640px; margin: 0 auto;
  }
  .empty-state-title {
    font-size: 28px; font-weight: 700; color: #1a1a1a;
    margin-bottom: 12px; text-align: center;
  }
  .empty-state-subtitle {
    font-size: 15px; color: #999; margin-bottom: 48px; text-align: center;
  }
  .empty-state-section-title {
    font-size: 15px; font-weight: 600; color: #333;
    margin-bottom: 16px; align-self: flex-start; width: 100%;
  }
  .empty-state-cards { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .empty-state-card {
    padding: 18px 22px; border: 1px solid #e8e8e8; border-radius: 12px;
    background: #fff; font-size: 14px; color: #333; line-height: 1.6;
    cursor: pointer; transition: all 0.2s;
  }
  .empty-state-card:hover { border-color: #4a6cf7; background: #f8f9ff; box-shadow: 0 2px 8px rgba(74,108,247,0.08); }

  .view-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: #f8f9fc; border-radius: 10px;
    margin-bottom: 20px; border-left: 3px solid #4a6cf7;
  }
  .view-header-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
    flex-shrink: 0; user-select: none;
  }
  .view-header-info { flex: 1; }
  .view-header-name { font-weight: 700; font-size: 15px; color: #1a1a1a; }
  .view-header-role { font-size: 12px; color: #999; margin-top: 2px; }
  .view-header-responsibility {
    font-size: 13px; color: #555; background: #eef1ff;
    padding: 4px 12px; border-radius: 14px; font-weight: 500;
  }

  .user-msg-row { display: flex; justify-content: flex-end; margin-bottom: 20px; animation: fadeIn 0.3s ease; }
  .user-bubble {
    max-width: 72%; background: #4a6cf7; color: #fff;
    padding: 12px 18px; border-radius: 18px 18px 4px 18px;
    font-size: 14px; line-height: 1.6;
  }

  .agent-block { margin-bottom: 24px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .agent-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .agent-header-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
    flex-shrink: 0; user-select: none;
  }
  .agent-header-info { display: flex; flex-direction: column; gap: 2px; }
  .agent-header-name { font-weight: 700; font-size: 15px; color: #1a1a1a; }
  .agent-header-time { font-size: 12px; color: #999; }

  .agent-body { padding-left: 44px; font-size: 14px; line-height: 1.75; color: #333; }
  .agent-body p { margin-bottom: 8px; }
  .agent-body h3 { font-size: 15px; font-weight: 700; margin: 16px 0 8px; color: #1a1a1a; }
  .agent-body strong { font-weight: 700; }
  .agent-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
  .agent-body table th, .agent-body table td { border: 1px solid #e8e8e8; padding: 8px 12px; text-align: left; }
  .agent-body table th { background: #fafafa; font-weight: 600; color: #555; }
  .agent-body table td:first-child { font-weight: 600; color: #333; white-space: nowrap; }


  .think-section { margin: 12px 0; border: 1px solid #eef0f5; border-radius: 10px; overflow: hidden; background: #fafbfd; }
  .think-toggle {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    cursor: pointer; user-select: none; font-size: 13px; font-weight: 600; color: #555;
    transition: background 0.2s;
  }
  .think-toggle:hover { background: #f0f2f8; }
  .think-toggle .think-icon {
    width: 18px; height: 18px; border-radius: 50%; background: #e8ecf5;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .think-toggle .think-icon svg { width: 11px; height: 11px; fill: #667; transition: transform 0.3s; }
  .think-toggle.open .think-icon svg { transform: rotate(180deg); }
  .think-toggle .think-label { flex: 1; }
  .think-content {
    max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s ease;
    padding: 0 14px; font-size: 13px; line-height: 1.7; color: #555; background: #fafbfd;
  }
  .think-content.open { max-height: 2000px; padding: 0 14px 14px; }
  .think-content p { margin-bottom: 6px; }
  .think-content ol, .think-content ul { padding-left: 20px; margin-bottom: 8px; }
  .think-content li { margin-bottom: 4px; }

  .phase-section {
    margin: 16px 0; padding: 16px; background: #f8f9fc;
    border-radius: 10px; border-left: 3px solid #4a6cf7;
  }
  .phase-title { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; }
  .phase-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
  .phase-table th, .phase-table td { border: 1px solid #e0e3ea; padding: 8px 12px; text-align: left; }
  .phase-table th { background: #f0f2f8; font-weight: 600; color: #555; }

  .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 500; }
  .status-designing { background: #fff3e0; color: #e67e22; }
  .status-completed { background: #e8f5e9; color: #4caf50; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .status-designing .status-dot { background: #e67e22; animation: pulse 1.5s infinite; }
  .status-completed .status-dot { background: #4caf50; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .inline-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #4a6cf7; cursor: pointer; margin: 8px 0; transition: color 0.2s; }
  .inline-link:hover { color: #3b5de7; }
  .inline-link svg { width: 14px; height: 14px; fill: #4a6cf7; }

  .typing-indicator { display: flex; gap: 4px; padding: 8px 0; }
  .typing-indicator span { width: 7px; height: 7px; border-radius: 50%; background: #ccc; animation: bounce 1.4s infinite ease-in-out; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1);opacity:1} }

  .status-line { display: flex; align-items: center; gap: 8px; padding-left: 44px; margin: 12px 0; font-size: 13px; color: #999; }
  .status-line .status-icon { width: 16px; height: 16px; }
  .status-line .status-icon svg { width: 16px; height: 16px; fill: #bbb; }

  .clarification-card {
    margin: 16px 0 24px;
    border-radius: 16px;
    overflow: hidden;
    background: #f5f5f7;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .clarification-card-body {
    padding: 18px 20px 14px;
    font-size: 14px;
    line-height: 1.7;
    color: #1a1a1a;
  }
  .clarification-card-body code {
    background: #eee;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'SF Mono', Monaco, monospace;
  }
  .clarification-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
    color: #333;
    border-top: 1px solid #e8e8e8;
  }
  .clarification-option:hover {
    background: #ededf0;
  }
  .clarification-option.selected {
    background: #1a1a2e;
    color: #fff;
  }
  .clarification-option .opt-num {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    background: #e0e0e0;
    color: #666;
  }
  .clarification-option.selected .opt-num {
    background: #333;
    color: #fff;
  }
  .clarification-option .opt-text {
    flex: 1;
  }
  .clarification-option .opt-arrow {
    font-size: 18px;
    color: #999;
  }
  .clarification-option.selected .opt-arrow {
    color: #fff;
  }
  .clarification-option .opt-edit {
    font-size: 14px;
    color: #bbb;
  }
  .clarification-option.selected .opt-edit {
    color: #ccc;
  }

  .action-confirm-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 16px;
    padding: 14px 18px;
    background: #f5f5f7;
    border-radius: 12px;
    font-size: 13px;
    color: #555;
    line-height: 1.5;
  }
  .action-confirm-card p {
    flex: 1;
    margin: 0;
  }
  .undo-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #ddd;
    background: #fff;
    font-size: 13px;
    color: #333;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .undo-btn:hover {
    background: #f0f0f0;
    border-color: #bbb;
  }
  .undo-btn.undone {
    color: #999;
    cursor: default;
  }
  .undo-btn.undone:hover {
    background: #fff;
    border-color: #ddd;
  }

  .agent-bar {
    background: #fff; border-top: 1px solid #eee; padding: 10px 24px;
    display: flex; align-items: center; gap: 8px; overflow-x: auto; flex-shrink: 0;
  }
  .agent-bar::-webkit-scrollbar { height: 0; }

  .agent-chip-all {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px;
    border-radius: 24px; border: 1.5px solid #e0e0e0; background: #fff;
    cursor: pointer; transition: all 0.2s; flex-shrink: 0; user-select: none;
    font-size: 13px; font-weight: 600; color: #555;
  }
  .agent-chip-all:hover { border-color: #4a6cf7; background: #f0f3ff; }
  .agent-chip-all.active { border-color: #4a6cf7; background: #eef1ff; box-shadow: 0 0 0 2px rgba(74,108,247,0.15); color: #4a6cf7; }
  .agent-chip-all img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .agent-chip-all.active img { }
  .agent-chip-all svg { width: 16px; height: 16px; fill: #666; }
  .agent-chip-all.active svg { fill: #4a6cf7; }
  .agent-chip-all .agent-chip-check svg { fill: #fff; width: 11px; height: 11px; }

  .agent-chip {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px;
    border-radius: 24px; border: 1.5px solid #e0e0e0; background: #fff;
    cursor: pointer; transition: all 0.2s; flex-shrink: 0; user-select: none;
  }
  .agent-chip:hover { border-color: #4a6cf7; background: #f0f3ff; }
  .agent-chip.active { border-color: #4a6cf7; background: #eef1ff; box-shadow: 0 0 0 2px rgba(74,108,247,0.15); }
  .agent-chip-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
    flex-shrink: 0; user-select: none;
  }
  .agent-chip-info { display: flex; flex-direction: column; line-height: 1.2; }
  .agent-chip-name { font-size: 12px; font-weight: 600; color: #1a1a1a; }
  .agent-chip-role { font-size: 10px; color: #999; }
  .agent-chip-check {
    width: 18px; height: 18px; border-radius: 50%; background: #4caf50;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .agent-chip-check svg { width: 11px; height: 11px; fill: #fff; }
  .agent-chip-loading {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #e0e0e0; border-top-color: #4a6cf7;
    flex-shrink: 0; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .agent-chip-more {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #e0e0e0; background: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: all 0.2s;
  }
  .agent-chip-more:hover { border-color: #4a6cf7; background: #f0f3ff; }
  .agent-chip-more svg { width: 14px; height: 14px; fill: #666; }

  .scenario-tabs {
    position: fixed; top: 12px; left: 16px; z-index: 100;
    display: flex; gap: 6px;
  }
  .scenario-tab {
    padding: 5px 14px; border-radius: 16px; border: 1.5px solid #e0e0e0;
    background: #fff; font-size: 12px; font-weight: 600; color: #666;
    cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .scenario-tab:hover { border-color: #4a6cf7; color: #4a6cf7; }
  .scenario-tab.active { border-color: #4a6cf7; background: #eef1ff; color: #4a6cf7; }
</style>
</head>
<body>

<div class="scenario-tabs" id="scenarioTabs">
  <div class="scenario-tab active" data-scenario="0">空白态</div>
  <div class="scenario-tab" data-scenario="1">复杂场景</div>
  <div class="scenario-tab" data-scenario="2">简单场景</div>
  <div class="scenario-tab" data-scenario="3">修改工作流场景</div>
</div>

<div class="conversation-area" id="conversationArea"></div>
<div class="agent-bar" id="agentBar"></div>

let currentView = 'all';

function renderAgentBar() {
  const bar = document.getElementById('agentBar');
  bar.innerHTML = '';

  if (currentScenario === '0') return;

  const allChip = document.createElement('div');
  allChip.className = 'agent-chip-all' + (currentView === 'all' ? ' active' : '');
  allChip.onclick = () => { currentView = 'all'; renderAgentBar(); renderConversation(); };
  allChip.innerHTML = '<img src="' + AVATAR_URI + '" alt="OmniX"><span>OmniX助理</span><div class="agent-chip-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>';
  bar.appendChild(allChip);

  if (currentScenario === '1') {
    agents.forEach(agent => {
      const chip = document.createElement('div');
      chip.className = 'agent-chip' + (currentView === agent.id ? ' active' : '');
      chip.onclick = () => { currentView = agent.id; renderAgentBar(); renderConversation(); };
      const isRunning = agent.id === 'electronics' || agent.id === 'powertrain';
      chip.innerHTML =
        '<div class="agent-chip-avatar" style="background:' + agent.color + '">' + agent.avatar + '</div>' +
        '<div class="agent-chip-info">' +
          '<span class="agent-chip-name">' + agent.name + '</span>' +
          '<span class="agent-chip-role">' + agent.role + '</span>' +
        '</div>' +
        (isRunning
          ? '<div class="agent-chip-loading"></div>'
          : '<div class="agent-chip-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>');
      bar.appendChild(chip);
    });
  }
}

function renderEmptyState(area) {
  const container = document.createElement('div');
  container.className = 'empty-state';
  container.innerHTML =
    '<div class="empty-state-title">OmniX小助手</div>' +
    '<div class="empty-state-subtitle">一起探索你的好奇心</div>' +
    '<div class="empty-state-section-title">获取新的灵感</div>' +
    '<div class="empty-state-cards">' +
      '<div class="empty-state-card">OmniX小助手能为我做什么？</div>' +
      '<div class="empty-state-card">调整一下专家团，在数据总监后新增一个财务审计专家。</div>' +
      '<div class="empty-state-card">帮我分析一下这个月的财务数据，写一份财务报告。</div>' +
    '</div>';
  area.appendChild(container);
}

function renderConversation() {
  const area = document.getElementById('conversationArea');
  area.innerHTML = '';

  if (currentScenario === '0') {
    renderEmptyState(area);
    return;
  }

  const data = scenarioData[currentScenario] || conversationData;

  if (currentView === 'all') {
    data.forEach(item => renderMessageItem(area, item));
  } else {
    const agent = agents.find(a => a.id === currentView);
    if (!agent) return;

    const header = document.createElement('div');
    header.className = 'view-header';
    header.innerHTML =
      '<div class="view-header-avatar" style="background:' + agent.color + '">' + agent.avatar + '</div>' +
      '<div class="view-header-info">' +
        '<div class="view-header-name">' + agent.name + '</div>' +
        '<div class="view-header-role">' + agent.role + '</div>' +
      '</div>' +
      '<div class="view-header-responsibility">' + agent.responsibility + '</div>';
    area.appendChild(header);

    const userMsg = conversationData.find(i => i.type === 'user');
    if (userMsg) {
      const row = document.createElement('div');
      row.className = 'user-msg-row';
      row.innerHTML = '<div class="user-bubble">' + escapeHtml(userMsg.text) + '</div>';
      area.appendChild(row);
    }

    const block = document.createElement('div');
    block.className = 'agent-block';
    block.innerHTML =
      '<div class="agent-header">' +
        '<div class="agent-header-avatar" style="background:' + agent.color + '">' + agent.avatar + '</div>' +
        '<div class="agent-header-info"><span class="agent-header-name">' + agent.name + '</span><span class="agent-header-time">' + agent.time + ' ›</span></div>' +
      '</div>' +
      '<div class="agent-body">' +
        (agent.thinkContent ? '<div class="think-section"><div class="think-toggle" onclick="toggleThink(this)"><div class="think-icon"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></div><span class="think-label">深度思考</span></div><div class="think-content">' + agent.thinkContent + '</div></div>' : '') +
        agent.body +
      '</div>' +
      '</div>';
    area.appendChild(block);
  }
  area.scrollTop = 0;
}

function renderMessageItem(area, item) {
  if (item.type === 'user') {
    const row = document.createElement('div');
    row.className = 'user-msg-row';
    row.innerHTML = '<div class="user-bubble">' + escapeHtml(item.text) + '</div>';
    area.appendChild(row);
  } else if (item.type === 'agent') {
    const block = document.createElement('div');
    block.className = 'agent-block';
    block.innerHTML =
      '<div class="agent-header">' +
        '<img class="agent-header-avatar" src="' + AVATAR_URI + '" />' +
        '<div class="agent-header-info"><span class="agent-header-name">OmniX助理</span><span class="agent-header-time">' + item.time + ' ›</span></div>' +
      '</div>' +
      '<div class="agent-body">' +
        (item.thinkContent ? '<div class="think-section"><div class="think-toggle" onclick="toggleThink(this)"><div class="think-icon"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></div><span class="think-label">深度思考</span></div><div class="think-content">' + item.thinkContent + '</div></div>' : '') +
        item.body +
      '</div>' +
      '</div>';
    area.appendChild(block);
  } else if (item.type === 'link') {
    const linkEl = document.createElement('div');
    linkEl.style.paddingLeft = '44px';
    linkEl.innerHTML = '<div class="inline-link"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>' + item.text + '</div>';
    area.appendChild(linkEl);
  } else if (item.type === 'phase2') {
    const phaseBlock = document.createElement('div');
    phaseBlock.className = 'agent-block';
    phaseBlock.style.paddingLeft = '44px';
    let tableRows = '';
    item.experts.forEach(exp => {
      const agent = agents.find(a => a.id === exp.agentId);
      const statusClass = exp.status === 'designing' ? 'status-designing' : 'status-completed';
      const statusText = exp.status === 'designing' ? '设计中...' : '已完成';
      tableRows += '<tr><td><span style="display:inline-flex;align-items:center;gap:6px"><img src="' + AVATAR_URI + '" style="width:22px;height:22px;border-radius:50%;object-fit:cover" />' + exp.name + '</span></td><td>' + exp.responsibility + '</td><td><span class="status-badge ' + statusClass + '"><span class="status-dot"></span>' + statusText + '</span></td></tr>';
    });
    phaseBlock.innerHTML = '<div class="phase-section"><div class="phase-title">' + item.title + '</div><table class="phase-table"><tr><th>专家</th><th>负责域</th><th>状态</th></tr>' + tableRows + '</table><p style="font-size:13px;color:#666;margin-top:10px">' + item.note + '</p></div>';
    area.appendChild(phaseBlock);
  } else if (item.type === 'status') {
    const statusEl = document.createElement('div');
    statusEl.className = 'status-line';
    statusEl.innerHTML = '<span class="status-icon"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg></span>' + item.text;
    area.appendChild(statusEl);
  } else if (item.type === 'clarification-card') {
    const card = document.createElement('div');
    card.className = 'clarification-card';
    let html = '<div class="clarification-card-body">' + item.body + '</div>';
    item.options.forEach((opt, idx) => {
      let right = '';
      if (opt.arrow) right = '<span class="opt-arrow">→</span>';
      else if (opt.edit) right = '<span class="opt-edit">✎</span>';
      const selectedClass = idx === 0 ? ' selected' : '';
      html += '<div class="clarification-option' + selectedClass + '" data-id="' + opt.id + '"><span class="opt-num">' + opt.id + '</span><span class="opt-text">' + opt.text + '</span>' + right + '</div>';
    });
    card.innerHTML = html;
    card.querySelectorAll('.clarification-option').forEach(el => {
      el.onclick = function() {
        if (this.classList.contains('selected')) return;
        card.querySelectorAll('.clarification-option').forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
        const replyBlock = document.createElement('div');
        replyBlock.className = 'agent-block';
        replyBlock.innerHTML =
          '<div class="agent-header">' +
            '<img class="agent-header-avatar" src="' + AVATAR_URI + '" />' +
            '<div class="agent-header-info"><span class="agent-header-name">OmniX助理</span><span class="agent-header-time">已完成 12s ›</span></div>' +
          '</div>' +
          '<div class="agent-body"><p>已删除"结论与共识提炼"节点，保留其余节点不变，并确保"行动项与风险跟进"仍可流转至"会议纪要成稿交付"。已通过校验，画布可以刷新。</p>' +
          '<div class="action-confirm-card"><p>已删除"结论与共识提炼"节点，保留其余节点不变，并确保"行动项与风险跟进"仍可流转至"会议纪要成稿交付"。</p><button class="undo-btn" onclick="handleUndo(this)"> 撤销</button></div></div>';
        area.appendChild(replyBlock);
        area.scrollTop = area.scrollHeight;
      };
    });
    area.appendChild(card);
  }
}

function toggleThink(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function handleUndo(btn) {
  if (btn.classList.contains('undone')) return;
  btn.classList.add('undone');
  btn.textContent = '↩ 已撤销';
  const area = document.getElementById('conversationArea');
  const replyBlock = document.createElement('div');
  replyBlock.className = 'agent-block';
  replyBlock.innerHTML =
    '<div class="agent-header">' +
      '<img class="agent-header-avatar" src="' + AVATAR_URI + '" />' +
      '<div class="agent-header-info"><span class="agent-header-name">OmniX助理</span><span class="agent-header-time">已完成 5s ›</span></div>' +
    '</div>' +
    '<div class="agent-body"><p>上一步操作已经撤销。</p></div>';
  area.appendChild(replyBlock);
  area.scrollTop = area.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

renderAgentBar();
renderConversation();

document.querySelectorAll('.scenario-tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.scenario-tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    currentScenario = this.dataset.scenario;
    currentView = 'all';
    renderAgentBar();
    renderConversation();
  });
});
