<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* ========== Sidebar ========== */
        .sidebar {
            width: 260px;
            min-width: 260px;
            height: 100vh;
            background: #f7f7f7;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: transparent;
        }
        .sidebar:hover::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        /* --- Header --- */
        .sidebar-header {
            padding: 12px 16px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .window-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .window-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dot-red {
            background: #ff5f56;
            border: 1px solid #e0443e;
        }
        .dot-yellow {
            background: #ffbd2e;
            border: 1px solid #dea123;
        }
        .dot-green {
            background: #27ca40;
            border: 1px solid #1aab29;
        }
        .header-icons {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .header-icon {
            width: 15px;
            height: 15px;
            color: #666;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s;
        }
        .header-icon:hover {
            opacity: 1;
        }

        .app-title {
            font-size: 13px;
            color: #aaa;
            padding: 0 16px 10px;
            user-select: none;
        }

        /* --- Nav Items --- */
        .nav-list {
            list-style: none;
            padding: 0 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13.5px;
            color: #333;
            cursor: pointer;
            transition: background 0.12s;
            user-select: none;
        }
        .nav-item:hover {
            background: #eaeaea;
        }
        .nav-item.active {
            background: #e0e0e0;
        }
        .nav-icon {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            color: #555;
        }

        /* --- Section --- */
        .section {
            margin-top: 18px;
            padding: 0 8px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px 6px;
            font-size: 12px;
            color: #999;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }
        .section-header:hover {
            color: #777;
        }
        .section-header svg {
            width: 12px;
            height: 12px;
            color: #bbb;
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }
        .section-header.open svg {
            transform: rotate(90deg);
        }

        .section-list {
            list-style: none;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.25s ease;
            max-height: 800px;
            opacity: 1;
        }
        .section-list.collapsed {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        .section-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
            transition: background 0.12s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
        }
        .section-item:hover {
            background: #eaeaea;
        }
        .section-item.active {
            background: #e0e0e0;
        }
        .section-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: #777;
        }

        .sub-section {
            margin-left: 20px;
        }
        .sub-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
            transition: background 0.12s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
        }
        .sub-item:hover {
            background: #eaeaea;
        }
        .sub-item.active {
            background: #e0e0e0;
        }
        .sub-item-text {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Footer --- */
        .sidebar-footer {
            margin-top: auto;
            padding: 10px 8px 12px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.12s;
            user-select: none;
        }
        .user-profile:hover {
            background: #ebebeb;
        }
        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, #333, #555);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            flex-shrink: 0;
        }
        .user-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #222;
            flex: 1;
        }
        .user-chevron {
            width: 14px;
            height: 14px;
            color: #999;
        }

        /* ========== Main Content Area (iframe) ========== */
        .main-area {
            flex: 1;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }
        .main-area iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ========== Responsive tweaks ========== */
        @media (max-width: 640px) {
            .sidebar {
                width: 200px;
                min-width: 200px;
            }
            .nav-item,
            .section-item,
            .sub-item {
                font-size: 12px;
                padding: 5px 10px;
            }
            .app-title {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ====== Sidebar ====== -->
    <aside class="sidebar">

        <!-- Header -->
        <div class="sidebar-header">
            <div class="window-controls">
                <div class="window-dot dot-red"></div>
                <div class="window-dot dot-yellow"></div>
                <div class="window-dot dot-green"></div>
            </div>
            <div class="header-icons">
                <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="14" height="14" rx="2"/>
                    <line x1="9" y1="4" x2="9" y2="21"/>
                </svg>
                <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </div>
        </div>

        <div class="app-title">OmniX v0.3.3</div>

        <!-- Primary nav -->
        <ul class="nav-list">
            <li class="nav-item active" data-key="new-session">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                新会话
            </li>
            <li class="nav-item" data-key="knowledge-space">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                知识空间
            </li>
            <li class="nav-item" data-key="mcp">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                MCP
            </li>
            <li class="nav-item" data-key="skills">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                技能
            </li>
            <li class="nav-item" data-key="automation">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                自动化
            </li>
        </ul>

        <!-- 对话 Section -->
        <div class="section">
            <div class="section-header open" data-section="chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                对话 (4)
            </div>
            <ul class="section-list" data-section="chat">
                <li class="section-item" data-key="chat-1">设计一个球鞋文化介绍网站页...</li>
                <li class="section-item" data-key="chat-2">设计一个人个简历网页、内容...</li>
                <li class="section-item" data-key="chat-3">你好</li>
                <li class="section-item" data-key="chat-4">了解 OmniX 通用场景</li>
            </ul>
        </div>

        <!-- 项目 Section -->
        <div class="section">
            <div class="section-header open" data-section="project">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                项目 (B2)
            </div>
            <ul class="section-list" data-section="project">
                <li class="section-item" data-key="project-1">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                    NeoOmni官网设计
                    <svg style="width:12px;height:12px;color:#999;margin-left:auto;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </li>
                <li class="sub-section sub-item" data-key="project-1-1">设计一个企业管营首页、内...</li>
                <li class="sub-section sub-item" data-key="project-1-2">你好</li>
                <li class="sub-section sub-item" data-key="project-1-3">了解 NeoOmni官方产品</li>
            </ul>
        </div>

        <!-- IP设计 Section -->
        <div class="section">
            <div class="section-header open" data-section="ip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                IP设计
            </div>
            <ul class="section-list" data-section="ip">
                <li class="sub-section sub-item" data-key="ip-1">OmniX 卡通IP设计</li>
                <li class="sub-section sub-item" data-key="ip-2">了解 OmniX 通用场景</li>
            </ul>
        </div>

        <!-- User Profile -->
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar">👾</div>
                <span class="user-name">Jihyo</span>
                <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            </div>
        </div>

    </aside>

    <!-- ====== Main Content (iframe) ====== -->
    <main class="main-area">
        <iframe id="contentFrame" src="about:blank" title="OmniX 内容区"></iframe>
    </main>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const frame = document.getElementById('contentFrame');

            // ---------- Page generator ----------
            function generatePage(title, subtitle, extra) {
                const displayTitle = title || 'OmniX';
                const displaySub = subtitle || '欢迎使用 OmniX';
                const extraHtml = extra || '';
                return `
                    <!DOCTYPE html>
                    <html lang="zh-CN">
                    <head>
                        <meta charset="UTF-8" />
                        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                        <title>${displayTitle}</title>
                        <style>
                            * { margin: 0; padding: 0; box-sizing: border-box; }
                            body {
                                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
                                background: #f5f7fa;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                height: 100vh;
                                margin: 0;
                                padding: 20px;
                            }
                            .card {
                                background: #ffffff;
                                border-radius: 20px;
                                padding: 48px 40px;
                                max-width: 540px;
                                width: 100%;
                                box-shadow: 0 8px 40px rgba(0,0,0,0.06);
                                text-align: center;
                                transition: transform 0.2s;
                            }
                            .card .emoji {
                                font-size: 52px;
                                margin-bottom: 16px;
                                display: block;
                            }
                            .card h1 {
                                font-size: 26px;
                                font-weight: 600;
                                color: #1a1a1a;
                                margin-bottom: 8px;
                                letter-spacing: -0.3px;
                            }
                            .card .sub {
                                font-size: 15px;
                                color: #888;
                                line-height: 1.6;
                                margin-bottom: 4px;
                            }
                            .card .divider {
                                width: 40px;
                                height: 3px;
                                background: #e8e8e8;
                                border-radius: 4px;
                                margin: 20px auto 16px;
                            }
                            .card .meta {
                                font-size: 13px;
                                color: #aaa;
                                letter-spacing: 0.3px;
                            }
                            .card .extra {
                                margin-top: 16px;
                                font-size: 14px;
                                color: #666;
                                background: #f5f5f5;
                                padding: 8px 18px;
                                border-radius: 30px;
                                display: inline-block;
                            }
                            @media (max-width: 480px) {
                                .card { padding: 32px 20px; }
                                .card h1 { font-size: 22px; }
                            }
                        </style>
                    </head>
                    <body>
                        <div class="card">
                            <span class="emoji">✨</span>
                            <h1>${displayTitle}</h1>
                            <p class="sub">${displaySub}</p>
                            <div class="divider"></div>
                            <p class="meta">OmniX · 内容区</p>
                            ${extraHtml ? `<div class="extra">${extraHtml}</div>` : ''}
                        </div>
                    </body>
                    </html>
                `;
            }

            // ---------- 页面内容映射 ----------
            // 根据 data-key 返回 { title, subtitle, extra }
            const pageMap = {
                'new-session': {
                    title: '新会话',
                    subtitle: '开始一段新的对话',
                    extra: '点击左侧菜单探索更多'
                },
                'knowledge-space': {
                    title: '知识空间',
                    subtitle: '管理你的知识库与文档',
                    extra: '📚 构建专属知识体系'
                },
                'mcp': {
                    title: 'MCP',
                    subtitle: '模型上下文协议 · 工具集成',
                    extra: '🔌 连接外部能力'
                },
                'skills': {
                    title: '技能',
                    subtitle: '扩展 OmniX 的能力边界',
                    extra: '⚡ 自定义技能与插件'
                },
                'automation': {
                    title: '自动化',
                    subtitle: '自动执行任务与流程',
                    extra: '🤖 让工作流更智能'
                },
                'chat-1': {
                    title: '设计一个球鞋文化介绍网站页',
                    subtitle: '对话 · 球鞋文化',
                    extra: '💬 继续对话'
                },
                'chat-2': {
                    title: '设计一个人个简历网页、内容',
                    subtitle: '对话 · 个人简历',
                    extra: '💬 继续对话'
                },
                'chat-3': {
                    title: '你好',
                    subtitle: '对话 · 问候',
                    extra: '💬 继续对话'
                },
                'chat-4': {
                    title: '了解 OmniX 通用场景',
                    subtitle: '对话 · OmniX 介绍',
                    extra: '💬 继续对话'
                },
                'project-1': {
                    title: 'NeoOmni官网设计',
                    subtitle: '项目 · 官网设计',
                    extra: '📁 项目详情'
                },
                'project-1-1': {
                    title: '设计一个企业管营首页、内...',
                    subtitle: '项目 · 企业管营',
                    extra: '📄 子任务'
                },
                'project-1-2': {
                    title: '你好',
                    subtitle: '项目 · 问候',
                    extra: '📄 子任务'
                },
                'project-1-3': {
                    title: '了解 NeoOmni官方产品',
                    subtitle: '项目 · 产品了解',
                    extra: '📄 子任务'
                },
                'ip-1': {
                    title: 'OmniX 卡通IP设计',
                    subtitle: 'IP设计 · 卡通形象',
                    extra: '🎨 创意设计'
                },
                'ip-2': {
                    title: '了解 OmniX 通用场景',
                    subtitle: 'IP设计 · 场景应用',
                    extra: '🎨 创意设计'
                }
            };

            // ---------- 默认内容 (fallback) ----------
            function getPageData(key) {
                return pageMap[key] || {
                    title: key || 'OmniX',
                    subtitle: '加载内容…',
                    extra: '请选择左侧菜单'
                };
            }

            // ---------- 加载 iframe ----------
            function loadPage(key) {
                const data = getPageData(key);
                const html = generatePage(data.title, data.subtitle, data.extra);
                // 使用 srcdoc 加载
                frame.srcdoc = html;
            }

            // ---------- 高亮管理 ----------
            // 所有可点击的导航项
            const navItems = document.querySelectorAll('.nav-item, .section-item, .sub-item');

            function clearAllActive() {
                navItems.forEach(el => el.classList.remove('active'));
            }

            function setActive(el) {
                if (!el) return;
                clearAllActive();
                el.classList.add('active');
            }

            // ---------- 获取当前高亮项 ----------
            function getCurrentActive() {
                return document.querySelector('.nav-item.active, .section-item.active, .sub-item.active');
            }

            // ---------- 点击处理：导航 ----------
            function handleNavClick(target) {
                if (!target) return;
                const key = target.dataset.key;
                if (!key) return;

                // 如果点击的是已经激活的项，不重复加载
                if (target.classList.contains('active')) {
                    // 但可以刷新内容（可选），这里选择不刷新
                    return;
                }

                setActive(target);
                loadPage(key);
            }

            // ---------- 点击处理：section 展开/收起 ----------
            function toggleSection(header) {
                const sectionId = header.dataset.section;
                if (!sectionId) return;

                const list = document.querySelector(`.section-list[data-section="${sectionId}"]`);
                if (!list) return;

                const isOpen = header.classList.contains('open');
                if (isOpen) {
                    header.classList.remove('open');
                    list.classList.add('collapsed');
                } else {
                    header.classList.add('open');
                    list.classList.remove('collapsed');
                }
            }

            // ---------- 事件绑定 (事件委托) ----------
            const sidebar = document.querySelector('.sidebar');

            sidebar.addEventListener('click', function(e) {
                // 1. 检查是否点击了 section-header
                const header = e.target.closest('.section-header');
                if (header) {
                    e.preventDefault();
                    toggleSection(header);
                    return;
                }

                // 2. 检查是否点击了导航项 (nav-item, section-item, sub-item)
                const navTarget = e.target.closest('.nav-item, .section-item, .sub-item');
                if (navTarget) {
                    e.preventDefault();
                    handleNavClick(navTarget);
                    return;
                }
            });

            // ---------- 初始化：默认加载 ----------
            // 找到默认激活的项（带有 .active 的 nav-item）
            const defaultActive = document.querySelector('.nav-item.active');
            if (defaultActive) {
                const key = defaultActive.dataset.key;
                if (key) {
                    loadPage(key);
                } else {
                    // fallback
                    loadPage('new-session');
                }
            } else {
                // 如果没有任何 active，激活 "新会话"
                const firstNav = document.querySelector('.nav-item');
                if (firstNav) {
                    setActive(firstNav);
                    const key = firstNav.dataset.key || 'new-session';
                    loadPage(key);
                }
            }

            // ---------- 确保所有 section 的初始状态与 open 类一致 ----------
            document.querySelectorAll('.section-header').forEach(header => {
                const sectionId = header.dataset.section;
                if (!sectionId) return;
                const list = document.querySelector(`.section-list[data-section="${sectionId}"]`);
                if (!list) return;
                const isOpen = header.classList.contains('open');
                if (!isOpen) {
                    list.classList.add('collapsed');
                } else {
                    list.classList.remove('collapsed');
                }
            });

            // ---------- 键盘 / 辅助（可选） ----------
            // 允许通过 Enter 键触发点击
            sidebar.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const target = e.target.closest('.section-header, .nav-item, .section-item, .sub-item');
                    if (target) {
                        e.preventDefault();
                        target.click();
                    }
                }
            });

            // 给所有可点击元素添加 role 和 tabindex 以提升可访问性
            document.querySelectorAll('.section-header, .nav-item, .section-item, .sub-item').forEach(el => {
                if (!el.hasAttribute('role')) {
                    el.setAttribute('role', 'button');
                    el.setAttribute('tabindex', '0');
                }
            });

        })();
    </script>

</body>
</html>
