<svg viewBox="0 0 680 580" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">企业级 Skill 权限设计框架</text>

  <!-- Outer container -->
  <rect x="40" y="48" width="600" height="528" rx="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="60" y="72" font-size="13" font-weight="500" fill="#444441">企业管理员视角</text>

  <!-- Layer 1: 贡献准入 -->
  <rect x="60" y="90" width="560" height="100" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="80" y="112" font-size="13" font-weight="500" fill="#0C447C">第一层：贡献准入控制(本次开放所有用户可贡献,不做限制型配置)</text>
  <text x="80" y="132" font-size="12" fill="#5F5E5A">谁能贡献 Skill 到企业库？</text>

  <!-- 4 policy options -->
  <rect x="80" y="145" width="120" height="32" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="140" y="161" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" dominant-baseline="central">允许所有用户</text>

  <rect x="210" y="145" width="120" height="32" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="0.5"/>
  <text x="270" y="161" text-anchor="middle" font-size="11" font-weight="500" fill="#6B7280" dominant-baseline="central">白名单模式</text>

  <rect x="340" y="145" width="120" height="32" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="0.5"/>
  <text x="400" y="161" text-anchor="middle" font-size="11" font-weight="500" fill="#6B7280" dominant-baseline="central">黑名单模式</text>

  <rect x="470" y="145" width="120" height="32" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="0.5"/>
  <text x="530" y="161" text-anchor="middle" font-size="11" font-weight="500" fill="#6B7280" dominant-baseline="central">禁止所有用户</text>

  <!-- Layer 2: 审核机制 -->
  <rect x="60" y="200" width="560" height="100" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="80" y="222" font-size="13" font-weight="500" fill="#633806">第二层：审核机制</text>
  <text x="80" y="242" font-size="12" fill="#5F5E5A">贡献后如何验证质量与安全？</text>

  <rect x="80" y="255" width="160" height="32" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="160" y="271" text-anchor="middle" font-size="11" font-weight="500" fill="#633806" dominant-baseline="central">功能审核（是否可用）</text>

  <rect x="250" y="255" width="160" height="32" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="330" y="271" text-anchor="middle" font-size="11" font-weight="500" fill="#633806" dominant-baseline="central">安全审核（权限合规）</text>

  <rect x="420" y="255" width="170" height="32" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="505" y="271" text-anchor="middle" font-size="11" font-weight="500" fill="#633806" dominant-baseline="central">合规审核（数据安全）</text>

  <!-- Layer 3: 分发策略 -->
  <rect x="60" y="310" width="560" height="130" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="80" y="332" font-size="13" font-weight="500" fill="#085041">第三层：分发策略（谁能用）</text>
  <text x="80" y="352" font-size="12" fill="#5F5E5A">Skill 入库后，控制成员的使用范围（默认归属部门为企业内所有部门）</text>

  <!-- Strategy types -->
  <rect x="80" y="365" width="160" height="50" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="160" y="384" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C" dominant-baseline="central">默认允许</text>
  <text x="160" y="396" text-anchor="middle" font-size="10" fill="#085041" dominant-baseline="central">全员可见可用</text>

  <rect x="250" y="365" width="160" height="50" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="330" y="384" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C" dominant-baseline="central">白名单策略</text>
  <text x="330" y="396" text-anchor="middle" font-size="10" fill="#085041" dominant-baseline="central">仅指定人/部门可用</text>

  <rect x="420" y="365" width="170" height="50" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="505" y="384" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C" dominant-baseline="central">黑名单策略</text>
  <text x="505" y="396" text-anchor="middle" font-size="10" fill="#085041" dominant-baseline="central">指定人/部门禁用</text>

  <!-- Priority rule -->
  <text x="340" y="432" text-anchor="middle" font-size="11" font-weight="500" fill="#0F6E56">优先级：黑名单 > 白名单 > 默认允许</text>

  <!-- Layer 4: 生命周期管理 -->
  <rect x="60" y="448" width="560" height="115" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="80" y="470" font-size="13" font-weight="500" fill="#3C3489">第四层：生命周期管理</text>
  <text x="80" y="490" font-size="12" fill="#5F5E5A">Skill 在企业库中的状态控制</text>

  <!-- Lifecycle operations -->
  <rect x="80" y="503" width="90" height="32" rx="6" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="125" y="519" text-anchor="middle" font-size="11" font-weight="500" fill="#26215C" dominant-baseline="central">启用</text>

  <rect x="180" y="503" width="90" height="32" rx="6" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="225" y="519" text-anchor="middle" font-size="11" font-weight="500" fill="#26215C" dominant-baseline="central">停用</text>

  <rect x="280" y="503" width="90" height="32" rx="6" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="325" y="519" text-anchor="middle" font-size="11" font-weight="500" fill="#26215C" dominant-baseline="central">编辑</text>

  <rect x="380" y="503" width="90" height="32" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="0.5"/>
  <text x="425" y="519" text-anchor="middle" font-size="11" font-weight="500" fill="#6B7280" dominant-baseline="central">版本更新</text>

  <rect x="480" y="503" width="90" height="32" rx="6" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="525" y="519" text-anchor="middle" font-size="11" font-weight="500" fill="#26215C" dominant-baseline="central">删除</text>
</svg>
