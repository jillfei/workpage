}

/* ============================================================
   回收站
============================================================ */
function openTrash() {
  state.trashOpen = true;
  state.trashTab = 'all'; state.trashQ = '';
  state.trashSel.clear();
  $('#pageList').classList.add('hidden');
  $('#pageDetail').classList.add('hidden');
  $('#pageTrash').classList.remove('hidden');
  renderTrash();
  $('#scrollArea').scrollTop = 0;
}
function exitTrash() {
  state.trashOpen = false;
  state.trashSel.clear();
  $('#pageTrash').classList.add('hidden');
  showList();
}
function setTrashTab(t) { state.trashTab = t; state.trashSel.clear(); renderTrash(); }
function filteredTrash() {
  const q = state.trashQ.trim().toLowerCase();
  let list = TRASH.filter(t => {
    if (state.trashTab === 'client' && t.source !== 'client') return false;
    if (state.trashTab === 'admin' && t.source !== 'admin') return false;
    if (q && !(t.name + ' ' + (t.desc || '') + ' ' + t.owner).toLowerCase().includes(q)) return false;
    return true;
  });
  return list.sort((a, b) => String(b.deletedAt).localeCompare(String(a.deletedAt)));
}
function trashTabCount(tab) {
  if (tab === 'all') return TRASH.length;
  return TRASH.filter(t => t.source === tab).length;
}
function renderTrash() {
  const list = filteredTrash();
  const selCount = state.trashSel.size;
  const allChecked = list.length > 0 && list.every(t => state.trashSel.has(t.id));
  $('#pageTrash').innerHTML = `
    <div class="breadcrumb" style="padding-top:6px">
      <span style="font-size:18px;font-weight:650;color:var(--text);letter-spacing:-.2px">回收站</span>
    </div>
    <div class="trash-tabs">
      <button class="trash-tab ${state.trashTab === 'all' ? 'on' : ''}" onclick="setTrashTab('all')">全部<span class="num">${trashTabCount('all')}</span></button>
      <button class="trash-tab ${state.trashTab === 'client' ? 'on' : ''}" onclick="setTrashTab('client')">客户端创建<span class="num">${trashTabCount('client')}</span></button>
      <button class="trash-tab ${state.trashTab === 'admin' ? 'on' : ''}" onclick="setTrashTab('admin')">管理端创建<span class="num">${trashTabCount('admin')}</span></button>
      <div class="spacer"></div>
      <div class="search" style="height:33px;margin-bottom:8px">
        ${icon('i-search', 'ic sm')}
        <input placeholder="搜索回收站" value="${esc(state.trashQ)}" oninput="state.trashQ=this.value;renderTrash()">
      </div>
    </div>
    <div class="trash-toolbar">
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);cursor:pointer">
        <input type="checkbox" class="chk" ${allChecked ? 'checked' : ''} onchange="toggleAllTrash(this.checked)">全选
      </label>
      <button class="btn sm" ${selCount ? '' : 'disabled'} onclick="batchRestoreTrash()">${icon('i-refresh', 'ic sm')}批量恢复${selCount ? `（${selCount}）` : ''}</button>
      <button class="btn sm danger" ${selCount ? '' : 'disabled'} onclick="batchPurgeTrash()">${icon('i-trash', 'ic sm')}批量删除${selCount ? `（${selCount}）` : ''}</button>
      <div class="spacer"></div>
      <button class="btn" onclick="exitTrash()">${icon('i-left', 'ic sm')}退出回收站</button>
    </div>
    ${list.length ? `<div class="trash-grid">
      ${list.map(t => trashCardHTML(t)).join('')}
    </div>` : `<div class="empty-state" style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-top:4px">
      <div class="big">${icon('i-trash', 'ic xl')}</div>
      <b>回收站为空</b>
      <span>${state.trashQ ? '没有找到匹配的知识库，试试其它关键词' : '已删除的知识库会在这里保留 30 天，可随时恢复'}</span>
    </div>`}
    <div class="trash-count">共 ${list.length} 条</div>
  `;
}
function trashCardHTML(t) {
  const on = state.trashSel.has(t.id);
  return `<div class="trash-card ${on ? 'sel' : ''}" onclick="toggleTrashSel('${t.id}',event)">
    <input type="checkbox" class="chk card-check" ${on ? 'checked' : ''} onclick="event.stopPropagation();toggleTrashSel('${t.id}')" onchange="this.checked=!this.checked">
    <div class="trash-card-top">
      <div class="kb-ico" style="background:${t.iconColor}">${esc(t.iconText || t.name.slice(0, 1))}</div>
      <div class="trash-card-meta">
        <div class="trash-name-row">
          <span class="trash-name" title="${esc(t.name)}">${esc(t.name)}</span>
        </div>
        <div class="trash-card-owner">
          <span>${esc(t.owner)}</span>
        </div>
      </div>
    </div>
    <div class="trash-card-desc">${esc(t.desc || '无描述')}</div>
    <div class="trash-deleted">
      ${icon('i-clock', 'ic sm')}<span>在 ${esc(t.deletedAt.slice(0, 10))} 被 ${esc(t.deletedBy)} 删除</span>
      <span style="margin-left:auto">${fmtBytes(t.usedBytes)} · ${t.files} 个文件</span>
    </div>
    <div class="trash-actions">
      <button class="tbtn" onclick="event.stopPropagation();restoreTrash('${t.id}')">${icon('i-refresh', 'ic sm')}恢复</button>
      <button class="tbtn danger" onclick="event.stopPropagation();purgeTrash('${t.id}')">${icon('i-trash', 'ic sm')}彻底删除</button>
    </div>
  </div>`;
}
function toggleTrashSel(id, e) {
  if (e) e.stopPropagation();
  state.trashSel.has(id) ? state.trashSel.delete(id) : state.trashSel.add(id);
  renderTrash();
}
function toggleAllTrash(on) {
  const list = filteredTrash();
  list.forEach(t => on ? state.trashSel.add(t.id) : state.trashSel.delete(t.id));
  renderTrash();
}
function restoreTrash(id) {
  const t = TRASH.find(x => x.id === id);
  if (!t) return;
  doRestoreTrash(t);
}
function doRestoreTrash(t) {
  const idx = TRASH.indexOf(t);
  TRASH.splice(idx, 1);
  if (t._kb) {
    KBS.push(t._kb);
  } else {
    KBS.push({
      id: t.id.replace('kb_trash_', 'kb_restored_'),
      name: t.name, desc: t.desc,
      iconColor: t.iconColor, iconText: t.iconText,
      source: t.source, owner: t.owner, status: 'ok', statusTip: '全部文件已解析完成。',
      usedBytes: t.usedBytes, createdAt: t.originalUpdatedAt, updatedAt: fullTime(new Date()),
      mode: 'full',
      cfg: { llm: 'qwen3-8b-max', emb: 'qwen3.7-text-embedding', rerank: '', multimodal: false, vlm: '', vector: 'Qdrant', chunk: { strategy: '按标题切分', size: 512, overlap: 80, parentChild: false, parent: 4096, child: 384 }, retrieval: { vectorTopK: 10, keywordThreshold: 0.3, vectorThreshold: 0.5, rerank: false, rerankTopK: 5, rerankThreshold: 0.2 }, aiQuestions: true, questionCount: 3, wikiGranularity: '标准' },
      members: [{ name: t.owner, role: '所有者' }],
      files: [], folders: [], logs: [], wiki: { state: 'empty', dirs: [], pages: [], summaries: [], index: null }
    });
  }
  state.trashSel.delete(t.id);
  toast(`「${t.name}」已恢复`);
  renderTrash();
}
function purgeTrash(id) {
  const t = TRASH.find(x => x.id === id);
  if (!t) return;
  confirmDialog({
    title: '彻底删除', danger: true, okText: '确认彻底删除',
    msg: `彻底删除知识库「<b>${esc(t.name)}</b>」？此操作不可恢复，其中的 <b>${t.files}</b> 个文档、分块与向量索引将一并清除。`,
    onOk: () => {
      TRASH.splice(TRASH.indexOf(t), 1);
      state.trashSel.delete(id);
      toast(`已彻底删除「${t.name}」`);
      renderTrash();
    }
  });
}
function batchRestoreTrash() {
  const items = TRASH.filter(t => state.trashSel.has(t.id));
  if (!items.length) return;
  const n = items.length;
  confirmDialog({
    title: '批量恢复', okText: `恢复 ${n} 个知识库`,
    msg: `确认恢复选中的 <b>${n}</b> 个知识库？恢复后将回到知识库列表。`,
    onOk: () => { items.forEach(t => doRestoreTrash(t)); toast(`已恢复 ${n} 个知识库`); }
  });
}
function batchPurgeTrash() {
  const items = TRASH.filter(t => state.trashSel.has(t.id));
  if (!items.length) return;
  const n = items.length;
  confirmDialog({
    title: '批量彻底删除', danger: true, okText: '确认彻底删除',
    msg: `彻底删除选中的 <b>${n}</b> 个知识库？此操作不可恢复，其中的文档、分块与向量索引将一并清除。`,
    onOk: () => {
      items.forEach(t => { TRASH.splice(TRASH.indexOf(t), 1); state.trashSel.delete(t.id); });
      toast(`已彻底删除 ${n} 个知识库`);
      renderTrash();
    }
  });
}
</script>
<script>
/* ============================================================

function openDetail(id, tab) {

          ${roleTagHTML(k)}

        <div class="detail-meta">
          <span class="item">${icon('i-user', 'ic sm')}所有者：${esc(k.owner)}（${esc(owner.dept)}）</span>

        <div class="add-doc-wrap">

        </div>

}
/* ============================================================
   文件管理
============================================================ */
function folderCount(files, path) {
  if (!path) return files.length;
  return files.filter(f => {
    const p = f.folder || '';
    return p === path || p.startsWith(path + ' / ');
  }).length;
}
function fileInFolder(f, path) {
  if (!path) return true;
  const p = f.folder || '';
  return p === path || p.startsWith(path + ' / ');
}
function treeRowsHTML(k, nodes, depth) {
  return nodes.map(n => {
    const hasChild = n.children && n.children.length;
    const open = (state.treeOpen || new Set()).has(n.path);
    const isOn = state.folder === n.path;
    return `<div class="tree-row ${isOn ? 'on' : ''}" style="padding-left:${8 + depth * 14}px" onclick="selectFolder('${esc(n.path)}')">
      <span class="chev ${open ? 'open' : ''}" onclick="event.stopPropagation();toggleFolder('${esc(n.path)}')" style="${hasChild ? '' : 'visibility:hidden'}">${icon('i-chev', 'ic sm')}</span>
      ${icon(depth === 0 ? 'i-book' : 'i-folder', 'ic ' + (depth === 0 ? 'book' : 'folder'))}
      <span class="tree-name" title="${esc(n.name)}">${esc(n.name)}</span>
      <span class="cnt">${folderCount(k.files, n.path)}</span>
      ${depth === 0 || !canEdit(k) ? '' : `<button class="more" title="更多" onclick="event.stopPropagation();folderMenu(event,'${esc(n.path)}')">${icon('i-more', 'ic sm')}</button>`}
    </div>
    ${hasChild && open ? treeRowsHTML(k, n.children, depth + 1) : ''}`;
  }).join('');
}
function buildTree(k) {
  const root = { name: k.name, path: '', children: [] };
  k.folders.forEach(fp => {
    const parts = fp.split(' / ');
    let node = root;
    let acc = '';
    parts.forEach(p => {
      acc = acc ? acc + ' / ' + p : p;
      let child = node.children.find(c => c.name === p);
      if (!child) { child = { name: p, path: acc, children: [] }; node.children.push(child); }
      node = child;
    });
  });
  return [root];
}
function toggleFolder(path) {
  state.treeOpen = state.treeOpen || new Set();
  if (state.treeOpen.has(path)) state.treeOpen.delete(path); else state.treeOpen.add(path);
  renderTabBody();
}
function selectFolder(path) {
  state.folder = path;
  state.page = 1;
  state.selected.clear();
  renderTabBody();
}
function folderMenu(e, path) {
  e.stopPropagation();
  const k = current();
  const name = path.split(' / ').pop();
  const cnt = folderCount(k.files, path);
  popMenu(e.currentTarget, `
    <button onclick="renameFolder('${esc(path)}')">${icon('i-edit', 'ic sm')}重命名</button>
    <button onclick="newSubFolder('${esc(path)}')">${icon('i-folder-plus', 'ic sm')}新建子文件夹</button>
    <div class="sep"></div>
    <button class="danger" onclick="deleteFolder('${esc(path)}', ${cnt})">${icon('i-trash', 'ic sm')}删除</button>
  `);
}
function renameFolder(path) {
  const k = current();
  const name = path.split(' / ').pop();
  promptDialog({
    title: '重命名文件夹', label: '文件夹名称', value: name, maxlength: 60,
    onOk: v => {
      if (!v) { toast('文件夹名称不能为空', 'err'); return false; }

      if (k.folders.some(f => f === np)) { toast(`已存在同名文件夹「${v}」`, 'err'); return false; }
      k.folders = k.folders.map(f => f === path ? np : (f.startsWith(path + ' / ') ? np + f.slice(path.length) : f));

/* 页码按钮序列：首页、末页与当前页附近，其余省略为 … */
function pageListHTML(page, pages, fn) {
  const call = fn || 'gotoPage';
  if (pages <= 1) return `<button class="page-btn active">1</button>`;
  const out = [];
  const set = new Set([1, pages, page - 1, page, page + 1]);
  if (page <= 3) [2, 3, 4].forEach(n => set.add(n));
  if (page >= pages - 2) [pages - 3, pages - 2, pages - 1].forEach(n => set.add(n));
  const nums = [...set].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
  let prev = 0;
  nums.forEach(n => {
    if (prev && n - prev > 1) out.push('<span class="page-ellipsis">…</span>');
    out.push(`<button class="page-btn ${n === page ? 'active' : ''}" onclick="${call}(${n})">${n}</button>`);
    prev = n;
  });
  return out.join('');
}

function promptRenameFile(id) {

  const ext = dot > 0 ? f.name.slice(dot) : '';
  promptDialog({
    title: '重命名文件', label: '文件名', value: base, suffix: ext, maxlength: 120,
    hint: '仅修改知识库中的文件名，本地原文件不受影响。',
    onOk: v => {

      const nn = v + ext;
      if (nn === f.name) return true;
      if (current().files.some(x => x.id !== id && x.folder === f.folder && x.name === nn)) {

      }
      const old = f.name;

      f.type = typeOf(nn);
      toast(`已将「${old}」重命名为「${nn}」`);
      return true;
    }

function isAllowedFileType(name) {
  const i = String(name).lastIndexOf('.');
  return i >= 0 && SUPPORTED_EXT.includes(String(name).slice(i + 1).toLowerCase());
}
function warnUnsupported(names) {
  if (!names.length) return;
  const show = names.slice(0, 2).join('、') + (names.length > 2 ? ` 等 ${names.length} 个文件` : '');
  toast(`不支持的格式：${show}，仅支持 ${ALLOWED_EXT_LABEL}`, 'err');
}

/* 选择本地文件（下拉入口 / 弹窗内拖拽区追加） */
function handleDocFiles(e) {
  const list = Array.from(e.target.files || []);
  e.target.value = '';
  if (!list.length) return;
  const bad = [];
  list.forEach(file => {
    if (pickedDocs.some(d => d.name === file.name && d.size === file.size)) return;
    const unsupported = !isAllowedFileType(file.name);
    pickedDocs.push({ name: file.name, size: file.size, unsupported });
    if (unsupported) bad.push(file.name);
  });
  warnUnsupported(bad);
  if (uploadPickMode === 'dropzone') { renderPickedDocs(); return; }
  if (pickedDocs.length) openAddDocDialog();
}

/* 选择本地文件夹：记录相对层级用于保留目录结构 */
function handleDocFolderInput(e) {
  const list = Array.from(e.target.files || []);
  e.target.value = '';
  if (!list.length) return;
  pickedFolderRoot = ''; pickedFolderPaths = [];
  const dirSet = {};
  const bad = [];
  list.forEach(file => {
    const rel = file.webkitRelativePath || file.name;
    const parts = rel.split('/');
    const displayName = parts[parts.length - 1];
    const subPath = parts.length > 1 ? parts.slice(1, -1).join('/') : '';
    if (!pickedFolderRoot && parts.length > 1) pickedFolderRoot = parts[0];
    if (subPath) dirSet[subPath] = true;
    if (pickedDocs.some(d => d.rel === rel)) return;
    const unsupported = !isAllowedFileType(displayName);
    pickedDocs.push({ name: displayName, size: file.size, rel, sub: subPath, unsupported });
    if (unsupported) bad.push(displayName);
  });
  pickedFolderPaths = Object.keys(dirSet).sort();
  warnUnsupported(bad);
  if (pickedDocs.length) openAddDocDialog();
}

/* 演示入口：模拟浏览器选择结果 */

  const bad = [['体检报告扫描件.rar', 18.6 * MB], ['排班系统导出.xlsm', 640 * KB], ['护士站监控片段.mp4', 42.8 * MB]];
  const denied = [];
  (allBad ? bad : good.concat(bad)).forEach(([name, size]) => {

    pickedDocs.push({ name, size, unsupported });

  warnUnsupported(denied);
  if (inModal) renderPickedDocs(); else openAddDocDialog();
}

/* 提交：配额校验（已满拦截 / 90% 二次确认）→ 入库并进入解析 */
function submitAddDocs() {
  const valid = pickedDocs.filter(d => !d.unsupported);
  if (!pickedDocs.length) { toast('请先选择要添加的文件', 'warn'); return; }
  if (!valid.length) { toast(`所选文件均不支持上传，仅支持 ${ALLOWED_EXT_LABEL}`, 'err'); return; }

  const used = usedTotal();
  const need = valid.reduce((s, d) => s + d.size, 0);
  if (used + need > globalQuota) { toast('存储空间已满，请清理后重试', 'err'); return; }
  if ((used + need) / globalQuota >= 0.9) {
    confirmDialog({
      title: '存储空间即将用尽', warn: true, okText: '继续上传',
      msg: `当前剩余 ${fmtBytes(Math.max(0, globalQuota - used))}，继续上传可能失败，是否仍要继续？`,
      onOk: () => doSubmitAddDocs(valid)
    });
    return;
  }
  doSubmitAddDocs(valid);
}

function doSubmitAddDocs(valid) {
  const k = current();
  const skipped = pickedDocs.length - valid.length;
  const target = $('#docTargetFolder').value;
  const keepStructure = !!pickedFolderRoot && $('#keepFolderStructure').checked;

  let baseFolder = target;
  if (keepStructure) {
    const rootPath = (target ? target.split(' / ') : []).concat([pickedFolderRoot]);
    addFolderPath(k, rootPath.join(' / '));
    pickedFolderPaths.forEach(sub => addFolderPath(k, rootPath.concat(sub.split('/')).join(' / ')));
    baseFolder = rootPath.join(' / ');
  }

  const now = fullTime(new Date());
  const items = valid.map(d => {
    let folder = baseFolder;
    if (keepStructure && d.sub) folder = baseFolder + ' / ' + d.sub.split('/').join(' / ');
    const nf = mkFile(d.name, folder, '待解析', d.size / MB, now, '孙礼飞');
    nf.sizeBytes = d.size;
    if (folder) addFolderPath(k, folder);
    k.files.unshift(nf);
    return nf;
  });
  k.updatedAt = now;

  closeAddDocDialog();
  state.selected.clear();
  state.page = 1;
  renderDetail();
  showProgressPanel(items, baseFolder);
  if (keepStructure) toast(`已导入文件夹「${pickedFolderRoot}」`);
  else if (skipped) toast(`已跳过 ${skipped} 个不支持的文件`);
  startParseItems(k, items);
}

/* 逐个模拟解析，完成后累计容量并刷新列表 */
function startParseItems(k, items) {
  items.forEach((f, i) => {
    setTimeout(() => {
      f.status = '解析中';
      if (state.currentId === k.id && state.tab === 'files') renderTabBody();
      updateProgressPanel();
      setTimeout(() => {
        f.status = '解析完成';
        f.time = fullTime(new Date());
        buildChunks(f);
        k.usedBytes += f.sizeBytes;
        if (state.currentId === k.id && state.tab === 'files') renderTabBody();
        updateProgressPanel();
        if (i === items.length - 1) { refreshKbStatus(); if (state.currentId === k.id) renderDetail(); }
      }, 1300 + i * 300);
    }, 500 + i * 250);
  });
}

/* 逐级补全文件夹路径，保证目录树出现新增层级 */
function addFolderPath(k, path) {
  let acc = '';
  String(path || '').split(' / ').filter(Boolean).forEach(p => {
    acc = acc ? acc + ' / ' + p : p;
    if (!k.folders.includes(acc)) k.folders.push(acc);
  });
}

  const list = state.progressFiles || [];

  if (done === list.length) {

    setTimeout(() => { if ($('#ppPanel') && state.progressFiles === list) $('#progressWrap').innerHTML = ''; }, 2600);

}

        <button class="fd-faq-addbtn" onclick="confirmFaqInput()">添加</button>
      </div>
      <div class="fd-faq-modal-list">
        ${faqs.length ? faqs.map((q, qi) => qi === editing
          ? `<div class="fd-faq-item editing">
               ${icon('i-info', 'ic')}
               <input class="fd-faq-edit-input" id="faqEditInput" value="${esc(q)}" onkeydown="onFaqEditKey(event,${qi})">
               <button class="fd-faq-act ok" title="保存" onclick="saveFaqEdit(${qi})">${icon('i-check', 'ic sm')}</button>
               <button class="fd-faq-act" title="取消" onclick="cancelFaqEdit()">${icon('i-x', 'ic sm')}</button>
             </div>`
          : `<div class="fd-faq-item">
               ${icon('i-info', 'ic')}
               <span class="fd-faq-text">${esc(q)}</span>
               ${editable ? `<button class="fd-faq-act" title="编辑问题" onclick="startFaqEdit(${qi})">${icon('i-edit', 'ic sm')}</button>
               <button class="fd-faq-act del" title="删除问题" onclick="delFaq(${qi})">${icon('i-x', 'ic sm')}</button>` : ''}
             </div>`).join('')
          : `<div class="fd-faq-empty">暂无辅助召回问题</div>`}
      </div>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn" onclick="closeFaqModal()">关闭</button>
    </div>`;

  if (fdState.faqEditing >= 0) {
    const el = $('#faqEditInput');
    if (el) { el.focus(); el.select(); }
  }
  if (fdState.faqAdding) {
    const el = $('#faqAddInput');
    if (el) el.focus();
  }
}

function showFaqInput() {
  fdState.faqAdding = true;
  fdState.faqEditing = -1;
  renderFaqModal();
}
function cancelFaqInput() {
  fdState.faqAdding = false;
  renderFaqModal();
}
function confirmFaqInput() {
  const c = faqChunk();
  const el = $('#faqAddInput');
  if (!c || !el) return;
  const q = el.value.trim();
  if (!q) { el.focus(); return; }
  c.faqs = c.faqs || [];
  c.faqs.push(q);
  fdState.faqAdding = false;
  renderFaqModal();
  if (state.fileDetailOpen !== false) { /* 主弹窗仍在，刷新卡片上的问题数 */ }
  renderFileDetailBody();
  toast('已添加 1 个辅助召回问题');
}
function startFaqEdit(qi) {
  fdState.faqEditing = qi;
  fdState.faqAdding = false;
  renderFaqModal();
}
function cancelFaqEdit() {
  fdState.faqEditing = -1;
  renderFaqModal();
}
function onFaqEditKey(e, qi) {
  if (e.key === 'Enter') { e.preventDefault(); saveFaqEdit(qi); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelFaqEdit(); }
}
function saveFaqEdit(qi) {
  const c = faqChunk();
  const el = $('#faqEditInput');
  if (!c || !el) return;
  const q = el.value.trim();
  if (!q) { toast('问题内容不能为空', 'err'); el.focus(); return; }
  c.faqs[qi] = q;
  fdState.faqEditing = -1;
  renderFaqModal();
  renderFileDetailBody();
  toast('问题已保存');
}
function delFaq(qi) {
  const c = faqChunk();
  if (!c) return;
  c.faqs.splice(qi, 1);
  fdState.faqEditing = -1;
  renderFaqModal();
  renderFileDetailBody();
  toast('已删除 1 个辅助召回问题');
}
function refreshFaqs() {
  const c = faqChunk();
  if (!c) return;
  c.faqs = ['本片段主要约定了哪些内容？', '与该文档主题相关的关键条款有哪些？', '如发生争议，本片段中有哪些依据可以参考？'];
  fdState.faqEditing = -1;
  renderFaqModal();
  renderFileDetailBody();
  toast('已重新生成辅助召回问题');
}

/* ============================================================
   对话试一试（参考技能调试页：左配置 / 右预览）
============================================================ */
const CHAT_SYSTEM_PROMPT = `你是一个严格基于知识库回答的助手。

## 核心规则
1. 回答任何问题前，必须先检索知识库。禁止仅凭你的训练数据作答。
2. 如果知识库中存在答案，必须严格依据知识库内容回答。
3. 如果知识库中找不到相关信息，直接回答："根据现有知识库无法回答该问题，建议联系人工确认。"禁止编造或推测。
4. 如果用户问题模糊，先追问澄清，不要猜测意图。

## 输出要求
- 回答简洁直接，不添加知识库以外的信息。
- 如果检索到多个片段，优先采用最相关的一条，必要时合并但需分别标注来源。`;


/* 文件集合调试：fileId 可以是单个 ID 或 ID 数组 */
function openChatTry(id, fileId) {
  const k = getKb(id);
  if (!k) return;
  const fileIds = Array.isArray(fileId) ? fileId.filter(Boolean) : (fileId ? [fileId] : []);
  const files = fileIds.map(fid => k.files.find(x => x.id === fid)).filter(Boolean);
  const single = files.length === 1 ? files[0] : null;
  const multi = files.length > 1;
  const key = files.length ? k.id + '::' + files.map(f => f.id).sort().join(',') : k.id;
  state.chatKey = key;
  state.chat = state.chat && state.chat.byKb ? state.chat : { byKb: {} };
  if (!state.chat.byKb[key]) {
    state.chat.byKb[key] = {
      model: (k.cfg && k.cfg.llm) || 'qwen3-8b-max',
      prompt: CHAT_SYSTEM_PROMPT,
      messages: [],
      sending: false
    };
  }
  const c = state.chat.byKb[key];
  const totalChunks = files.reduce((n, f) => n + ((f.chunks && f.chunks.length) || 5), 0);

  const heroIcon = single
    ? `<div class="chat-hero-icon" style="background:${FILE_TYPE_COLOR[single.type] || '#64748b'}">${single.type === 'image' ? 'IMG' : single.type.toUpperCase()}</div>`
    : multi
      ? `<div class="chat-hero-icon" style="background:var(--primary)">${icon('i-doc', 'ic lg')}</div>`
      : kbAvatarHTML(k, 'chat-hero-icon');

  const heroTitle = single ? single.name : multi ? `已选 ${files.length} 个文件` : k.name;
  const heroDesc = single
    ? `来自知识库「${k.name}」的文件调试，仅使用该文件的 ${totalChunks} 个分块作答。`
    : multi
      ? `来自知识库「${k.name}」的多文件调试，仅使用所选 ${files.length} 个文件的 ${totalChunks} 个分块作答。`
      : (k.desc || '基于该知识库中的文档内容进行问答，回答会附带引用来源。');

  const scopeCard = single
    ? `<div class="chat-file-card">
        <span class="fimg ${single.type}">${single.type === 'image' ? 'IMG' : single.type.toUpperCase()}</span>
        <div class="info">
          <b>${esc(single.name)}</b>
          <i>${esc(single.folder || '根目录')} · ${fmtSize(single.sizeBytes)} · ${totalChunks} 个分块</i>
        </div>
      </div>`
    : multi
      ? `<div class="chat-file-list">
          ${files.map(f => `<div class="chat-file-card">
            <span class="fimg ${f.type}">${f.type === 'image' ? 'IMG' : f.type.toUpperCase()}</span>
            <div class="info">
              <b>${esc(f.name)}</b>
              <i>${esc(f.folder || '根目录')} · ${fmtSize(f.sizeBytes)} · ${(f.chunks && f.chunks.length) || 5} 个分块</i>
            </div>
          </div>`).join('')}
        </div>`
      : '';

  const box = $('#chatModalBox');
  box.classList.add('chat-modal');
  box.innerHTML = `
    <div class="modal-head">
      <div class="chat-hero">
        ${heroIcon}
        <div class="chat-hero-main">
          <div class="chat-hero-title">${esc(heroTitle)}</div>
          <div class="chat-hero-desc">${esc(heroDesc)}</div>
        </div>
        <button class="modal-close chat-hero-close" onclick="closeMask('chatModal')">${icon('i-x', 'ic')}</button>
      </div>
    </div>

    <div class="chat-body">
      <section class="chat-left">
        <div class="chat-left-head">调试配置
          ${canConfig(k) ? `<button class="btn sm ghost" onclick="openChatRetrieval()">${icon('i-sliders', 'ic sm')}检索策略</button>` : ''}
        </div>
        <div class="chat-left-body">
          <div class="chat-field">
            <label>模型 <span class="req">*</span></label>
            <select class="select" onchange="state.chat.byKb['${key}'].model=this.value">
              ${['qwen3-8b-max', 'qwen3-32b', 'deepseek-v3'].map(m => `<option ${c.model === m ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
          </div>

          <div class="chat-field">
            <div class="chat-prompt-head">
              <label>系统提示词 <span class="req">*</span></label>
              <button class="mini" onclick="chatFillPrompt()">${icon('i-history', 'ic sm')}恢复默认</button>
            </div>
            <div class="chat-prompt-wrap">
              <textarea class="chat-prompt" id="chatPrompt" maxlength="20000"
                oninput="state.chat.byKb['${key}'].prompt=this.value;document.getElementById('chatPromptCount').textContent=this.value.length+'/20000'">${esc(c.prompt)}</textarea>
              <span class="chat-prompt-count" id="chatPromptCount">${c.prompt.length}/20000</span>
            </div>
          </div>

          <div class="chat-field">
            <label>${files.length ? (multi ? '文件' : '文件') : '知识库'} <span class="req">*</span></label>
            ${files.length ? '' : `<div class="chat-kb-card">
              ${kbAvatarHTML(k, 'kb-ico')}
              <div class="info">
                <b>${esc(k.name)}</b>
                <i>${esc(k.desc || '')}</i>
              </div>
            </div>`}
            ${scopeCard}
            <div class="chat-kb-tip">${files.length ? (multi ? `调试范围为所选的 ${files.length} 个文件，不可更改。` : '调试范围限定为该文件，不可更改。') : '调试时默认使用当前知识库，不可更改。'}</div>
          </div>
        </div>
      </section>

      <section class="chat-right">
        <div class="chat-right-head">预览调试
          <span class="meta">${files.length ? `${files.length} 个文件 · ${totalChunks} 个分块` : `${k.files.length} 个文件 · ${k.members.length} 名成员`}</span>
        </div>
        <div class="chat-stream" id="chatStream">${chatStreamHTML(k, c, files)}</div>
        <div class="chat-composer">
          <div class="chat-composer-box">
            <textarea id="chatInput" placeholder="请输入你的问题"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatTry('${key}');}"></textarea>
            <div class="chat-composer-tools">
              <button class="ibtn" title="上传附件（演示）" onclick="toast('原型演示：暂不支持附件上传')">${icon('i-plus', 'ic sm')}</button>
              <button class="ibtn" title="清空对话" onclick="clearChatTry('${key}')">${icon('i-trash', 'ic sm')}</button>
              <button class="chat-send" id="chatSend" title="发送" onclick="sendChatTry('${key}')">${icon('i-up', 'ic sm')}</button>
            </div>
          </div>
        </div>
      </section>
    </div>`;
  openMask('chatModal');
  setTimeout(() => { const el = $('#chatInput'); if (el) el.focus(); }, 30);
}

/* 文件行「试一试」：直接进入该文件的调试对话 */
function fileChatTry(fileId) {
  const k = current();
  const f = k && k.files.find(x => x.id === fileId);
  if (!f) return;
  openChatTry(k.id, f.id);
}

/* 批量「试一试」：把选中的多个文件作为检索范围 */
function batchChatTry() {
  const ids = Array.from(state.selected || []);
  if (!ids.length) { toast('请先选择文件', 'warn'); return; }
  openChatTry(current().id, ids);
}

/* ============================================================
   调试知识库 → 检索策略弹窗
   读写当前知识库的 cfg.retrieval，保存后立即生效于调试对话
============================================================ */
let chatRetrievalDraft = null;

function openChatRetrieval() {
  const k = current();
  if (!k) return;
  const r = (k.cfg && k.cfg.retrieval) || {};
  chatRetrievalDraft = {
    vectorTopK: r.vectorTopK != null ? r.vectorTopK : 10,
    keywordThreshold: r.keywordThreshold != null ? r.keywordThreshold : 0.3,
    vectorThreshold: r.vectorThreshold != null ? r.vectorThreshold : 0.5,
    rerank: !!r.rerank,
    rerankModel: r.rerankModel || (k.cfg && k.cfg.rerank) || 'qwen3-rerank',
    rerankTopK: r.rerankTopK != null ? r.rerankTopK : 5,
    rerankThreshold: r.rerankThreshold != null ? r.rerankThreshold : 0.2
  };
  renderChatRetrieval();
  openMask('chatRetrievalModal');
}

function renderChatRetrieval() {
  const d = chatRetrievalDraft;
  if (!d) return;
  const k = current();
  const setR = (key, val) => { d[key] = Number(val); };
  const models = ['qwen3-rerank', 'bge-reranker-v2-m3', 'cohere-rerank-v3'];
  $('#chatRetrievalModalBox').innerHTML = `
    <div class="modal-head">
      <b>检索策略</b>
      <span class="sub">${esc(k ? k.name : '')}</span>
      <div class="spacer"></div>
      <button class="modal-close" onclick="closeMask('chatRetrievalModal')">${icon('i-x', 'ic')}</button>
    </div>
    <div class="modal-body">
      <div class="hint" style="margin:0 0 4px">配置召回数量与相关性阈值，以及检索结果的重排方式</div>
      <div class="set-list">
        <div class="set-row">
          <div class="txt"><b>向量召回数量</b><i>向量检索返回的最大结果数量</i></div>
          <div class="ctl"><input class="input" type="number" min="1" max="100" value="${d.vectorTopK}"
            oninput="chatRetrievalDraft.vectorTopK=+this.value"></div>
        </div>
        <div class="set-row">
          <div class="txt"><b>关键词阈值</b><i>关键词检索的最低相关性分数</i></div>
          <div class="ctl">${setRangeHTML('crKeyword', 0, 1, 0.01, d.keywordThreshold, 'chatRetrievalDraft.keywordThreshold=+this.value', 2)}</div>
        </div>
        <div class="set-row">
          <div class="txt"><b>向量阈值</b><i>向量检索的最低相似度分数</i></div>
          <div class="ctl">${setRangeHTML('crVector', 0, 1, 0.01, d.vectorThreshold, 'chatRetrievalDraft.vectorThreshold=+this.value', 2)}</div>
        </div>
        <div class="set-row">
          <div class="txt"><b>重排序</b><i>对召回结果进行二次排序，提高回答准确性。启用后需配置重排数量、阈值与模型。</i></div>
          <div class="ctl"><span class="switch ${d.rerank ? 'on' : ''}" onclick="chatRetrievalDraft.rerank=!chatRetrievalDraft.rerank;renderChatRetrieval()"></span></div>
        </div>
      </div>
      ${d.rerank ? `<div class="set-list" style="margin-top:8px;padding-left:14px;border-left:2px solid var(--ok)">
        <div class="set-row">
          <div class="txt"><b>ReRank 模型 <span class="req">*</span></b><i>用于对知识库检索结果进行重排序，提高回答准确性</i></div>
          <div class="ctl"><select class="select" onchange="chatRetrievalDraft.rerankModel=this.value">
            ${models.map(m => `<option ${d.rerankModel === m ? 'selected' : ''}>${m}</option>`).join('')}
          </select></div>
        </div>
        <div class="set-row">
          <div class="txt"><b>重排数量</b><i>重排序后保留的最大结果数量</i></div>
          <div class="ctl"><input class="input" type="number" min="1" max="50" value="${d.rerankTopK}"
            oninput="chatRetrievalDraft.rerankTopK=+this.value"></div>
        </div>
        <div class="set-row">
          <div class="txt"><b>重排阈值</b><i>重排序的最低相关性分数</i></div>
          <div class="ctl">${setRangeHTML('crRerank', 0, 1, 0.01, d.rerankThreshold, 'chatRetrievalDraft.rerankThreshold=+this.value', 2)}</div>
        </div>
      </div>` : ''}
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn" onclick="closeMask('chatRetrievalModal')">取消</button>
      <button class="btn primary" onclick="saveChatRetrieval()">保存</button>
    </div>`;
}

function saveChatRetrieval() {
  const k = current();
  if (!k || !chatRetrievalDraft) return;
  const d = chatRetrievalDraft;
  k.cfg.retrieval = {
    ...k.cfg.retrieval,
    vectorTopK: Number(d.vectorTopK) || 10,
    keywordThreshold: Number(d.keywordThreshold),
    vectorThreshold: Number(d.vectorThreshold),
    rerank: !!d.rerank,
    rerankTopK: Number(d.rerankTopK) || 5,
    rerankThreshold: Number(d.rerankThreshold)
  };
  if (d.rerank) k.cfg.rerank = d.rerankModel;
  closeMask('chatRetrievalModal');
  toast('检索策略已更新');
}

/* 把 chatKey 还原成 { kb, files } */
function chatCtx(key) {
  const parts = String(key).split('::');
  const k = getKb(parts[0]);
  const ids = parts[1] ? parts[1].split(',') : [];
  const files = k ? ids.map(id => k.files.find(x => x.id === id)).filter(Boolean) : [];
  return { k, files };
}

function chatCiteText(text, refs) {
  const safe = esc(text);
  return safe.replace(/\[(\d+)\]/g, (m, num) => {
    const i = parseInt(num, 10) - 1;
    const r = refs && refs[i];
    if (!r) return m;
    const tip = r.file + " · 相似度 " + Math.round((r.score || 0) * 100) + "%";
    const arg = "'" + esc(r.fileId) + "'";
    const call = "closeMask('chatModal');openFileDetail(" + arg + ")";
    return '<sup class="chat-cite" data-tip="' + esc(tip) + '" onclick="' + call + '">[' + num + ']</sup>';
  });
}

/* 文件类型配色（对话卡片图标用） */
const FILE_TYPE_COLOR = {
  md: '#1f2937', txt: '#6b7280', pdf: '#dc2626', docx: '#2563eb',
  xlsx: '#059669', pptx: '#ea580c', image: '#6366f1'
};

/* 空态 / 消息列表；file 存在时展示文件专属空态 */
/* 空态 / 消息列表；files 非空时展示文件专属空态 */
function chatStreamHTML(k, c, files) {
  const list = Array.isArray(files) ? files : (files ? [files] : []);
  const single = list.length === 1 ? list[0] : null;

    if (list.length) {
      return `<div class="chat-empty">
        ${single
          ? `<span class="big" style="background:${FILE_TYPE_COLOR[single.type] || '#64748b'};font-size:15px;font-weight:700">${single.type === 'image' ? 'IMG' : single.type.toUpperCase()}</span>`
          : `<span class="big" style="background:var(--primary)">${icon('i-doc', 'ic lg')}</span>`}
        <b>${esc(single ? single.name : `已选 ${list.length} 个文件`)}</b>
        <span style="font-size:12px;color:var(--text-4)">${single ? '仅基于该文件的分块内容作答' : '仅基于所选文件的分块内容作答'}</span>
      </div>`;
    }
    return `<div class="chat-empty">
      ${kbAvatarHTML(k, 'big')}
      <b>${esc(k.name)}</b>
      <span style="font-size:12px;color:var(--text-4)">输入问题，基于该知识库中的文档内容作答</span>
    </div>`;
  }
  return c.messages.map(m => m.role === 'user'
    ? `<div class="chat-msg user"><span class="chat-bubble">${esc(m.text)}</span></div>`
    : `<div class="chat-msg ai">
        <span class="who" style="background:${single ? (FILE_TYPE_COLOR[single.type] || '#64748b') : list.length ? 'var(--primary)' : k.iconColor}">${esc(single ? (single.type === 'image' ? 'IMG' : single.type.toUpperCase()) : list.length ? '文件' : (k.iconText || k.name.slice(0, 1)))}</span>
        <div class="chat-bubble">${chatCiteText(m.text, m.refs)}${m.refs && m.refs.length ? `
          <div class="chat-refs">
            <div class="rh">${icon('i-doc', 'ic sm')}引用来源 ${m.refs.length} 条</div>
            ${m.refs.map((r, i) => `<div class="chat-ref" title="查看文件详情" onclick="openFileDetail('${esc(r.fileId)}')">
              <span class="idx">${i + 1}</span>
              <span class="fimg ${r.type}">${r.type === 'image' ? 'IMG' : r.type.toUpperCase()}</span>
              <span class="nm">${esc(r.file)}</span>
              <span class="sim">${Math.round(r.score * 100)}%</span>
              <span class="go">${icon('i-chev', 'ic sm')}</span>
            </div>`).join('')}
          </div>` : ''}</div>
      </div>`).join('');
}

function chatFillPrompt() {
  const key = state.chatKey;
  const c = state.chat && state.chat.byKb && state.chat.byKb[key];
  if (!c) return;
  c.prompt = CHAT_SYSTEM_PROMPT;
  const el = $('#chatPrompt');
  if (el) el.value = CHAT_SYSTEM_PROMPT;
  const cnt = $('#chatPromptCount');
  if (cnt) cnt.textContent = CHAT_SYSTEM_PROMPT.length + '/20000';
  toast('已恢复默认系统提示词');
}

function clearChatTry(key) {
  const c = state.chat.byKb[key];
  if (!c || !c.messages.length) return;
  c.messages = [];
  renderChatStream(key);
}

function renderChatStream(key) {
  const { k, files } = chatCtx(key);
  const c = state.chat.byKb[key];
  const box = $('#chatStream');
  if (box && k) box.innerHTML = chatStreamHTML(k, c, files);
  if (box) box.scrollTop = box.scrollHeight;
}

function sendChatTry(key) {
  const { k, files } = chatCtx(key);
  if (!k) return;
  const c = state.chat.byKb[key];
  const el = $('#chatInput');
  const q = el ? el.value.trim() : '';
  if (!q) { toast('请输入你的问题', 'warn'); return; }
  if (c.sending) return;
  el.value = '';
  c.messages.push({ role: 'user', text: q });
  c.sending = true;
  renderChatStream(key);
  const send = $('#chatSend');
  if (send) send.disabled = true;

  setTimeout(() => {
    const refs = recallSearch(k, q, files).slice(0, 3);
    const answer = chatAnswer(q, refs, k, files);
    c.messages.push({ role: 'ai', text: answer, refs });
    c.sending = false;
    renderChatStream(key);
    const btn = $('#chatSend');
    if (btn) btn.disabled = false;
  }, 700);
}

/* 依据召回分块拼装回答（原型演示）：正文内嵌 [n] 角标，对应下方引用来源 */
function chatAnswer(q, refs, k, files) {
  const fileList = Array.isArray(files) ? files : (files ? [files] : []);
  const singleFile = fileList.length === 1 ? fileList[0] : null;
  if (!refs.length) {
    return `根据现有知识库无法回答该问题，建议联系人工确认。

可以尝试：
1. 换一种表述或补充关键词；
2. 确认相关文档已上传并解析完成；
3. 在「召回测试」中调低关键词阈值或向量阈值后再试。`;
  }
  const clip = (t, n) => {
    const str = String(t || "").replace(/\s+/g, " ").trim();
    return str.length > n ? str.slice(0, n) + "……" : str;
  };

  const top = refs[0];
  const out = [];
  out.push(singleFile
    ? `根据文件「${singleFile.name}」的内容，关于「${q}」：`
    : fileList.length > 1
      ? `根据所选 ${fileList.length} 个文件的资料，关于「${q}」：`
      : `根据知识库「${k.name}」中的资料，关于「${q}」：`);
  out.push("");
  out.push(clip(top.text, 220) + " [1]");

  if (refs.length > 1) {
    out.push("");
    out.push("其他相关参考：");
    refs.slice(1).forEach((r, i) => {
      out.push((i + 2) + ". 《" + r.file + "》：" + clip(r.text, 60) + " [" + (i + 2) + "]");
    });
  }

  out.push("");
  out.push("以上内容来自 " + refs.length + " 个文档片段，点击角标可查看原文。");
  return out.join("\n");
}

function openCapacityModal(id) {
  const k = getKb(id);
  if (!k) return;
  const stats = {};
  let totalBytes = 0;
  k.files.forEach(f => {
    if (!stats[f.type]) stats[f.type] = { count: 0, bytes: 0 };
    stats[f.type].count++;
    stats[f.type].bytes += f.sizeBytes;
    totalBytes += f.sizeBytes;
  });

  const rows = CAP_TYPES.filter(t => stats[t.key] && stats[t.key].count > 0)
    .map(t => ({ ...t, ...stats[t.key], pct: totalBytes ? stats[t.key].bytes / totalBytes * 100 : 0 }));

  const stack = rows.map(r =>
    `<div class="cap-bar-seg" style="width:${Math.max(r.pct, 0.6).toFixed(2)}%;background:${r.color}" title="${r.label} ${r.pct.toFixed(1)}%"></div>`
  ).join('');

  $('#capacityModalBox').classList.add('cap-modal');
  $('#capacityModalBox').innerHTML = `
    <div class="modal-head"><b>容量统计</b><span class="sub">${esc(k.name)}</span>
      <div class="spacer"></div>

        <span class="cap-head-sub">共 ${k.files.length} 个文件</span>
        <span class="cap-head-total">${fmtSize(totalBytes)}</span>
      </div>
      <div class="cap-bar">${stack}</div>
      <div class="cap-legend">
        ${rows.map(r => `<span class="cap-legend-item"><span class="cap-legend-dot" style="background:${r.color}"></span>${r.label}</span>`).join('')}
      </div>
      <div class="cap-section-title">容量占比</div>
      <div class="cap-list">
        ${rows.map(r => `<div class="cap-row">
          <div class="cap-row-icon" style="background:${r.color}">${r.icon}</div>
          <div class="cap-row-main">
            <div class="cap-row-name">${r.label}</div>
            <div class="cap-row-ext">${r.ext}</div>
          </div>
          <div class="cap-row-count">${r.count}</div>
          <div class="cap-row-size">${fmtSize(r.bytes)}</div>
          <div class="cap-row-pct">${Math.round(r.pct)} %</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <span class="hint">该知识库与企业内其它知识库共享总配额</span>
      <div class="spacer"></div>
      <button class="btn primary" onclick="closeMask('capacityModal')">关闭</button>

  openMask('capacityModal');
}

/* ============================================================
   Wiki 引用来源：段落角标 + 页面底部参考来源
============================================================ */

/* 为页面构造引用数据：
   - 主来源为 sourceDoc
   - 从知识库中召回 2～3 个相关分块作为补充来源
   - 每个段落（## 小节）分配一条引用 */
function wikiRefs(k, p) {
  if (p._refs) return p._refs;
  const refs = [];

  const pushRef = (fileId, fileName, chunkNo, score) => {
    const key = fileId + '#' + chunkNo;
    if (refs.some(r => r.key === key)) return;
    const f = k.files.find(x => x.id === fileId);
    refs.push({
      key, fileId, file: fileName, type: f ? f.type : 'txt',
      chunkNo, score
    });
  };

  // 主来源
  const mainFile = k.files.find(f => f.name === p.sourceDoc);
  if (mainFile) {
    if (!mainFile.chunks || !mainFile.chunks.length) buildChunks(mainFile);
    pushRef(mainFile.id, mainFile.name, 1, 0.86);
  }

  // 补充来源：用页面标题做一次召回
  const extra = recallSearch(k, p.title).filter(r => !mainFile || r.file !== mainFile.name).slice(0, 2);
  extra.forEach((r, i) => pushRef(r.fileId, r.file, r.chunkNo || 1, r.score || (0.72 - i * 0.04)));

  // 兜底：如果没有召回结果，补同目录的其它文档
  if (!refs.length) {
    k.files.slice(0, 2).forEach((f, i) => pushRef(f.id, f.name, 1, 0.7 - i * 0.05));
  }

  p._refs = refs;
  return refs;
}

/* 正文按小节切分，为每个段落分配角标编号（1..n，循环使用） */
function wikiBodyWithRefs(p, w, k) {
  const refs = wikiRefs(k, p);
  if (!refs.length) return renderWikiMarkdown(p.body, w);
  let html = renderWikiMarkdown(p.body, w);

  // 「## 标题 + 正文」会被整体输出，先把标题后的裸文本包成段落
  html = html.replace(/(<\/(?:h3|h4)>)\s*([^<\s][\s\S]*?)(?=<\/(?:h3|h4)>|<h3|<h4|<ul|<p>|$)/g,
    (m, h, rest) => h + '<p>' + rest.trim() + '</p>');

  let n = 0;
  const cite = () => {
    const idx = n++ % refs.length;
    const r = refs[idx];
    const tip = r.file + ' · 分块 ' + r.chunkNo + ' · 相似度 ' + Math.round(r.score * 100) + '%';
    const arg = "'" + esc(r.fileId) + "'," + r.chunkNo;
    return '<sup class="wiki-cite" data-tip="' + esc(tip) + '" onclick="wikiOpenRef(' + arg + ')">[' + (idx + 1) + ']</sup>';
  };

  // 段落末尾加角标
  html = html.replace(/<p>([\s\S]*?)<\/p>/g, (m, inner) => '<p>' + inner + cite() + '</p>');
  // 列表最后一项末尾加角标（避免单独占一行）
  html = html.replace(/<li>([\s\S]*?)<\/li>(\s*)<\/ul>/g,
    (m, inner, sp) => '<li>' + inner + cite() + '</li>' + sp + '</ul>');
  return html;
}

function wikiOpenRef(fileId, chunkNo) {
  const k = current();
  const f = k && k.files.find(x => x.id === fileId);
  if (!f) { toast('原文件已被删除', 'warn'); return; }
  openFileDetail(fileId);
}

/* 页面底部「参考来源」区块 */
function wikiRefsHTML(k, p) {
  const refs = wikiRefs(k, p);
  if (!refs.length) return '';
  const avg = refs.reduce((s, r) => s + r.score, 0) / refs.length;
  return `<div class="wiki-refs">
    <div class="wiki-refs-head">
      ${icon('i-doc', 'ic sm')}参考来源
      <span class="sub">共 ${refs.length} 个文档 · ${refs.length} 个分块 · 平均相似度 ${Math.round(avg * 100)}%</span>
    </div>
    <div class="wiki-refs-list">
      ${refs.map((r, i) => `<div class="wiki-ref" onclick="wikiOpenRef('${esc(r.fileId)}',${r.chunkNo})" title="查看文件详情">
        <span class="idx">${i + 1}</span>
        <span class="fimg ${r.type}">${r.type === 'image' ? 'IMG' : r.type.toUpperCase()}</span>
        <span class="nm">${esc(r.file)}</span>
        <span class="chunk">分块 ${r.chunkNo}</span>
        <span class="sim">${Math.round(r.score * 100)}%</span>
        <span class="go">${icon('i-chev', 'ic sm')}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderWikiMarkdown(md, w) {
  const titles = w.pages.map(p => p.title);
  let html = esc(md);
  html = html.replace(/\[\[([^\]]+)\]\]/g, (m, t) => titles.includes(t)
    ? `<span class="wl" onclick="openWikiPageByTitle('${t}')">${t}</span>` : `<span class="wl">${t}</span>`);
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  html = html.split(/\n{2,}/).map(block => {
    if (/^\s*<(h3|h4|ul)/.test(block.trim())) return block;
    if (!block.trim()) return '';
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return html;
}

function saveWikiPage(id) {
  const k = current();
  const title = $('#wpTitle').value.trim();
  const dir = $('#wpDir').value;

  const source = $('#wpSource').value;
  if (!title) { toast('请输入页面标题', 'err'); return; }
  if (k.wiki.pages.some(p => p.id !== id && p.title === title)) { toast(`页面「${title}」已存在`, 'err'); return; }
  if (id) {
    const p = k.wiki.pages.find(x => x.id === id);
    if (p.body !== body) {
      p.versions.unshift({ v: 'v' + (p.versions.length + 1), time: fullTime(new Date()), author: '孙礼飞', note: '内容更新', body: p.body });
    }
    Object.assign(p, { title, dir, body, sourceDoc: source, type: state.pageType, updated: fullTime(new Date()) });
    p._refs = null;
    toast(`页面「${title}」已保存`);
  } else {
    if (!k.wiki) k.wiki = { state: 'ready', dirs: [], pages: [], summaries: [], index: null };
    if (k.wiki.state !== 'ready') k.wiki.state = 'ready';
    if (!k.wiki.dirs.includes(dir)) k.wiki.dirs.push(dir);
    const np = {
      id: 'w' + (++_fid), title, dir, body, sourceDoc: source, type: state.pageType || '概念',
      updated: fullTime(new Date()), summary: '', versions: [{ v: 'v1', time: fullTime(new Date()), author: '孙礼飞', note: '初始创建内容', body }]
    };
    k.wiki.pages.push(np);
    state.wikiPage = np.id;
    toast(`页面「${title}」已创建`);
  }
  closeMask('wikiPageModal');
  state.wikiIndex = false;
  renderTabBody();

/* 版本回滚：把历史版本内容恢复为当前版本，并生成一条新的版本记录 */
function rollbackWikiVersion(id, idx) {
  const k = current();
  const p = k.wiki.pages.find(x => x.id === id);
  if (!p || !p.versions[idx]) return;
  const v = p.versions[idx];
  confirmDialog({
    title: '回滚版本', okText: '确认回滚', warn: true,
    msg: `将页面「<b>${esc(p.title)}</b>」回滚到 <b>${esc(v.v)}</b>（${esc(v.time)}）？当前内容会保留为历史版本。`,
    onOk: () => {
      p.versions.unshift({
        v: 'v' + (p.versions.length + 1), time: fullTime(new Date()), author: '孙礼飞',
        note: `回滚自 ${v.v}`, body: v.body
      });
      p.body = v.body;
      p.updated = fullTime(new Date());
      closeMask('wikiVersionModal');
      renderTabBody();
      toast(`页面已回滚到 ${v.v}`);
    }
  });
}

/* 向导读写 wiz.data.members；详情页读写当前知识库 members */
function memberCtx() {
  if (document.getElementById('wizardModal').classList.contains('show') && wiz && wiz.data) {
    return {
      members: wiz.data.members,
      refresh: () => renderWizard(),
      apply: null
    };
  }
  const k = current();
  return {
    members: k.members,
    refresh: () => renderTabBody(),
    apply: () => { k.owner = (k.members.find(m => m.role === '所有者') || {}).name || k.owner; }
  };
}
function memberSetRole(i, role) {
  const ctx = memberCtx();
  ctx.members[i].role = role;
  if (ctx.apply) { ctx.apply(); ctx.refresh(); }
}
function memberRemove(i) {
  const ctx = memberCtx();
  const m = ctx.members[i];
  ctx.members.splice(i, 1);
  if (ctx.apply) ctx.apply();
  ctx.refresh();
  toast(`已移除成员「${m.name}」`);
}

          <div class="picker-count" id="wizPickCount">已选 0 个</div>
          <div class="picker-selected" id="wizPickSelected"></div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" onclick="closeMemberPickerDialog()">取消</button>
      <button class="btn primary" onclick="confirmMemberPickerDialog()">确认</button>
    </div>`;
  renderMemberPicker();
  openMask('memberPickerModal');
}
function closeMemberPickerDialog() {
  closeMask('memberPickerModal');
  $('#memberPickerModalBox').classList.remove('picker-modal');
}
function memberPickerSearch(v) {
  state.memberPicker.keyword = String(v || '').trim().toLowerCase();
  renderMemberPicker();
}
function memberSelectable() {
  const taken = new Set(memberCtx().members.map(m => m.name));
  const out = [];
  orgTreeData().forEach(g => g.children.forEach(d => d.members.forEach(m => {
    if (!taken.has(m.name)) out.push({ ...m, deptId: d.id });
  })));
  return out;
}
function renderMemberPicker() {
  const tree = $('#wizPickTree');
  if (!tree) return;
  const p = state.memberPicker;
  const selectable = memberSelectable();
  const ids = new Set(selectable.map(m => m.name));
  const kw = p.keyword;
  let html = '';

  if (kw) {
    const hits = selectable.filter(m => (m.name + ' ' + m.phone + ' ' + m.dept).toLowerCase().includes(kw));
    html = hits.length
      ? hits.map(m => `<label class="tree-node tree-member" style="padding-left:8px">
          <input type="checkbox" ${p.selected.has(m.name) ? 'checked' : ''} onchange="memberPickerToggle('${esc(m.name)}',this.checked)">
          <span>${esc(m.name)}</span><i>${esc(m.phone)} · ${esc(m.dept)}</i></label>`).join('')
      : '<div class="picker-empty">未找到匹配的成员</div>';
  } else {
    const allOn = selectable.length > 0 && selectable.every(m => p.selected.has(m.name));
    html += `<label class="tree-node tree-all">
      <input type="checkbox" ${allOn ? 'checked' : ''} onchange="memberPickerToggleAll(this.checked)">
      <span>全选</span></label>`;
    orgTreeData().forEach(g => {
      const open = p.expanded.has(g.id);
      const gMembers = g.children.reduce((acc, d) => acc.concat(d.members.filter(m => ids.has(m.name))), []);
      const gOn = gMembers.length > 0 && gMembers.every(m => p.selected.has(m.name));
      html += `<div class="tree-node tree-group">
        <span class="tree-caret ${open ? 'open' : ''}" onclick="event.preventDefault();memberPickerExpand('${g.id}')">${icon(open ? 'i-chev-d' : 'i-chev', 'ic')}</span>
        <input type="checkbox" ${gOn ? 'checked' : ''} onchange="memberPickerToggleGroup('${g.id}',this.checked)">
        <span>${esc(g.name)}</span></div>`;
      if (open) html += g.children.map(d => memberDeptNodeHTML(d, ids)).join('');
    });
  }
  tree.innerHTML = html;
  tree.querySelectorAll('input[data-indeterminate="1"]').forEach(cb => { cb.indeterminate = true; });

  const picked = selectable.filter(m => p.selected.has(m.name));
  $('#wizPickCount').textContent = `已选 ${picked.length} 个`;
  $('#wizPickSelected').innerHTML = picked.length
    ? picked.map(m => `<div class="sel-item">
        <div><b>${esc(m.name)}</b><i>${esc(m.dept)}</i></div>
        <button class="sel-remove" title="移除" onclick="memberPickerUnpick('${esc(m.name)}')">${icon('i-x', 'ic sm')}</button>
      </div>`).join('')
    : '<div class="picker-empty">暂未选择成员</div>';
}
function memberDeptNodeHTML(d, ids) {
  const p = state.memberPicker;
  const open = p.expanded.has(d.id);
  const avail = d.members.filter(m => ids.has(m.name));
  const picked = avail.filter(m => p.selected.has(m.name)).length;
  const allOn = avail.length > 0 && picked === avail.length;
  const indet = picked > 0 && !allOn;
  const head = `<div class="tree-node tree-dept-title">
    <span class="tree-caret ${open ? 'open' : ''}" onclick="event.preventDefault();memberPickerExpand('${d.id}')">${icon(open ? 'i-chev-d' : 'i-chev', 'ic')}</span>
    <input type="checkbox" ${allOn ? 'checked' : ''} ${avail.length ? '' : 'disabled'} ${indet ? 'data-indeterminate="1"' : ''} onchange="memberPickerToggleDept('${d.id}',this.checked)">
    <span>${esc(d.name)}</span></div>`;
  if (open && !avail.length) return `<div>${head}<div class="tree-all-picked">该部门成员均已添加</div></div>`;
  const kids = open ? avail.map(m => `<label class="tree-node tree-member">
      <input type="checkbox" ${p.selected.has(m.name) ? 'checked' : ''} onchange="memberPickerToggle('${esc(m.name)}',this.checked)">
      <span>${esc(m.name)}</span><i>${esc(m.phone)}</i></label>`).join('') : '';
  return `<div>${head}${kids}</div>`;
}
function memberPickerExpand(id) {
  const p = state.memberPicker;
  if (p.expanded.has(id)) p.expanded.delete(id); else p.expanded.add(id);
  renderMemberPicker();
}
function memberPickerToggle(name, on) {
  if (on) state.memberPicker.selected.add(name); else state.memberPicker.selected.delete(name);
  renderMemberPicker();
}
function memberPickerUnpick(name) {
  state.memberPicker.selected.delete(name);
  renderMemberPicker();
}
function memberPickerToggleDept(deptId, on) {
  const d = orgTreeData()[0].children.find(x => x.id === deptId);
  if (!d) return;
  const ids = new Set(memberSelectable().map(m => m.name));
  d.members.forEach(m => {
    if (!ids.has(m.name)) return;
    if (on) state.memberPicker.selected.add(m.name); else state.memberPicker.selected.delete(m.name);
  });
  renderMemberPicker();
}
function memberPickerToggleGroup(groupId, on) {
  const ids = new Set(memberSelectable().map(m => m.name));
  orgTreeData().filter(g => g.id === groupId).forEach(g => g.children.forEach(d => d.members.forEach(m => {
    if (!ids.has(m.name)) return;
    if (on) state.memberPicker.selected.add(m.name); else state.memberPicker.selected.delete(m.name);
  })));
  renderMemberPicker();
}
function memberPickerToggleAll(on) {
  memberSelectable().forEach(m => {
    if (on) state.memberPicker.selected.add(m.name); else state.memberPicker.selected.delete(m.name);
  });
  renderMemberPicker();
}
function confirmMemberPickerDialog() {
  const ctx = memberCtx();
  const picked = memberSelectable().filter(m => state.memberPicker.selected.has(m.name));
  if (!picked.length) { toast('请至少选择一位成员', 'warn'); return; }
  picked.forEach(m => ctx.members.push({ name: m.name, role: '编辑者' }));
  closeMemberPickerDialog();
  if (ctx.apply) ctx.apply();
  ctx.refresh();
  toast(`已添加 ${picked.length} 位成员`);
}

/* ---------- 转让所有者 ---------- */
function openTransferDialog() {
  const ctx = memberCtx();
  $('#memberPickerModalBox').classList.remove('picker-modal');
  const firstOwnerIdx = ctx.members.findIndex(m => m.role === '所有者');
  const cands = ctx.members.filter((m, i) => i !== firstOwnerIdx && (m.role === '管理员' || m.role === '编辑者'));
  if (!cands.length) { toast('没有可作为新所有者的管理员或编辑者', 'warn'); return; }
  $('#memberPickerModalBox').innerHTML = `
    <div class="modal-head"><b>转让所有者</b>
      <div class="spacer"></div>
      <button class="modal-close" onclick="closeMask('memberPickerModal')">${icon('i-x', 'ic')}</button>
    </div>
    <div class="modal-body">
      <div class="field" style="margin-bottom:0">
        <label>选择新的所有者</label>
        <select class="select" id="wizTransferTarget">
          <option value="">请选择成员</option>
          ${cands.map(m => `<option value="${esc(m.name)}">${esc(m.name)}（${esc(m.role)}）· ${esc(person(m.name).dept)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" onclick="closeMask('memberPickerModal')">取消</button>
      <button class="btn primary" onclick="confirmTransferOwner()">确认转让</button>
    </div>`;
  openMask('memberPickerModal');
}
function confirmTransferOwner() {
  const name = $('#wizTransferTarget').value;
  if (!name) { toast('请选择新的所有者', 'warn'); return; }
  const ctx = memberCtx();
  const members = ctx.members;
  const oldOwner = members.find(m => m.role === '所有者');
  const target = members.find(m => m.name === name);
  if (!target) return;
  if (oldOwner) oldOwner.role = '管理员';
  target.role = '所有者';
  // 新所有者置顶
  const rest = members.filter(m => m !== target);
  members.length = 0;
  members.push(target, ...rest);
  closeMask('memberPickerModal');
  if (ctx.apply) ctx.apply();
  ctx.refresh();
  toast(`已将所有者转让给「${name}」，原所有者变为管理员`);
}

============================================================ */
function promptDialog(opts) {
  const o = Object.assign({ title: '', label: '', value: '', placeholder: '', hint: '', suffix: '', maxlength: 120 }, opts);
  $('#promptModalBox').innerHTML = `
    <div class="modal-head"><b>${esc(o.title)}</b><div class="spacer"></div>
      <button class="modal-close" onclick="closeMask('promptModal')"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <div class="field" style="margin-bottom:${o.hint ? '10px' : '0'}">
        <label>${esc(o.label)}</label>
        <div style="display:flex;align-items:center;gap:0">
          <input class="input" id="pdInput" value="${esc(o.value)}" placeholder="${esc(o.placeholder)}" maxlength="${o.maxlength}">
          ${o.suffix ? `<span style="padding:0 10px;font-size:13px;color:var(--text-3);background:#f7f8fa;border:1px solid var(--border);border-left:none;height:37px;display:inline-flex;align-items:center;border-radius:0 9px 9px 0">${esc(o.suffix)}</span>` : ''}
        </div>
        ${o.hint ? `<div class="hint">${esc(o.hint)}</div>` : ''}
      </div>
    </div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" onclick="closeMask('promptModal')">取消</button>
      <button class="btn primary" onclick="runPrompt()">确定</button>
    </div>`;
  if (o.suffix) {
    $('#pdInput').style.borderRadius = '9px 0 0 9px';
  }
  _promptHandler = o.onOk;
  openMask('promptModal');
  setTimeout(() => { const el = $('#pdInput'); if (el) { el.focus(); el.select(); } }, 60);
  $('#pdInput').addEventListener('keydown', e => { if (e.key === 'Enter') runPrompt(); });
}
let _promptHandler = null;
function runPrompt() {
  const el = $('#pdInput');
  if (!el) return;
  const v = el.value.trim();
  const fn = _promptHandler;
  if (fn) {
    const ok = fn(v);
    if (ok === false) return;
  }
  closeMask('promptModal');
  _promptHandler = null;
  if (state.currentId) renderDetail(); else if (!$('#pageList').classList.contains('hidden')) renderList();
}

    multimodal: d.multimodal, vlm: d.multimodal ? d.vlm : '', vector: 'Qdrant',
    chunk: { strategy: d.chunkStrategy, size: d.chunkSize, overlap: d.chunkOverlap, parentChild: d.parentChild, parent: d.parentSize, child: d.childSize },
    retrieval: { vectorTopK: d.vectorTopK, keywordThreshold: d.keywordThreshold, vectorThreshold: d.vectorThreshold, rerank: d.rerankOn, rerankTopK: d.rerankTopK, rerankThreshold: d.rerankThreshold },
    aiQuestions: d.aiQuestions, questionCount: d.questionCount, wikiGranularity: d.wikiGranularity
  };

  if (wiz.mode === 'edit') {
    const k = getKb(wiz.id);
    k.name = d.name;
    k.desc = d.desc;
    k.iconColor = d.iconColor;
    k.iconImg = d.iconImg;
    k.cfg = cfg;
    k.members = d.members;
    k.updatedAt = fullTime(new Date());
    closeMask('wizardModal');
    toast('知识库已保存');
    if (state.currentId === k.id) renderDetail(); else renderList();
    return;
  }

  const nk = {
    id: 'kb_' + Date.now().toString(36),
    name: d.name,
    desc: d.desc,
    iconColor: d.iconColor,
    iconImg: d.iconImg,
    iconText: d.name.slice(0, 1),
    source: 'admin',
    admin: { creator: '孙礼飞' },
    owner: '孙礼飞',
    status: 'ok', statusTip: '全部文件已解析完成。',
    usedBytes: 0,
    createdAt: fullTime(new Date()),
    updatedAt: fullTime(new Date()),
    mode: wiz.createMode,
    cfg,
    members: d.members,
    files: [],
    folders: [],
    wiki: { state: 'empty', dirs: [], pages: [], summaries: [], index: null },
    logs: [{ action: '创建知识库', target: `${d.name}（管理端创建）`, actor: '孙礼飞', time: fullTime(new Date()) }]
  };
  KBS.unshift(nk);
  closeMask('wizardModal');
  toast(`知识库「${d.name}」创建成功`);
  openDetail(nk.id);
}
</script>
<script>
/* ============================================================
   初始化
============================================================ */
state.treeOpen = new Set();

/* 默认打开全部一级文件夹，便于查看 */
KBS.forEach(k => {
  (k.folders || []).forEach(fp => {
    if (fp.split(' / ').length === 1) state.treeOpen.add(fp);
  });
});

/* 预生成部分文档的分块，确保文件详情有内容 */
KBS.forEach(k => {
  k.files.forEach(f => {
    if (f.status === '解析完成' && (!f.chunks || !f.chunks.length)) buildChunks(f);
  });
  if (k.files[0]) {
    k.files[0].meta = [
      { k: '适用部门', v: person(k.owner).dept },
      { k: '保密级别', v: '内部' }
    ];
  }
});

renderList();

/* 上传弹窗：拖拽文件到拖拽区追加 */
(function initDropzone() {
  const dz = $('#docDropzone');
  if (!dz) return;
  ['dragenter', 'dragover'].forEach(evt => dz.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation(); dz.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(evt => dz.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation(); dz.classList.remove('dragover');
  }));
  dz.addEventListener('drop', e => {
    const dropped = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    if (!dropped.length) return;
    const bad = [];
    dropped.forEach(file => {
      if (pickedDocs.some(d => d.name === file.name && d.size === file.size)) return;
      const unsupported = !isAllowedFileType(file.name);
      pickedDocs.push({ name: file.name, size: file.size, unsupported });
      if (unsupported) bad.push(file.name);
    });
    warnUnsupported(bad);
    renderPickedDocs();
  });
})();

/* ============================================================
   召回测试 / 召回历史
============================================================ */
function recallState(k) {
  state.recall = state.recall || {};
  const r = state.recall;
  if (!r.byKb) r.byKb = {};
  if (!r.byKb[k.id]) r.byKb[k.id] = { q: '', results: null, emptyTip: '请进行测试以查看结果', history: [], activeIdx: 0 };
  return r.byKb[k.id];
}

/* ---------- 召回测试 ---------- */
function recallTestPaneHTML(k) {
  const r = recallState(k);
  return `<div class="recall-wrap">
    <section class="recall-card">
      <div class="recall-card-head">召回测试
        <div class="spacer"></div>
        <button class="recall-mode-btn" onclick="openRecallStrategy()" title="检索策略设置">
          ${icon('i-grid', 'ic sm')}<span>检索策略</span>
        </button>
      </div>
      <div class="recall-card-body">
        <div class="recall-input">
          <textarea id="recallInput" placeholder="请输入文本，建议使用简短的陈述句。" oninput="recallOnInput(this.value);recallToggleCancel(this.value)">${esc(r.q)}</textarea>
          <div class="recall-input-actions">
            <button class="recall-cancel ${r.q ? '' : 'hidden'}" id="recallCancel" onclick="clearRecallInput()">取消</button>
            <button class="recall-submit" onclick="runRecallTest()">测试</button>
          </div>
        </div>
        <div class="recall-subhead">${icon('i-clock', 'ic sm')}测试记录</div>
        ${recallLogTableHTML(r, 'test')}
      </div>
    </section>

    <section class="recall-card">
      <div class="recall-card-head">测试结果
      </div>
      <div class="recall-card-body" style="padding-top:14px">
        ${r.results
          ? `<div class="recall-results">${r.results.map(recallItemHTML).join('')}</div>`
          : `<div class="recall-result-empty"><div class="big">${icon('i-search', 'ic lg')}</div><span>${esc(r.emptyTip)}</span></div>`}
      </div>
    </section>
  </div>`;
}

function recallLogTableHTML(r, kind) {
  const logs = r.history;
  if (!logs.length) {
    return `<div class="recall-table-wrap"><table class="recall-table">
      <thead><tr><th style="width:38%">内容</th><th>时间</th><th>响应时间</th><th>测试人员</th></tr></thead>
      <tbody><tr><td colspan="4"><div class="recall-empty">暂无数据</div></td></tr></tbody>
    </table></div>`;
  }
  return `<div class="recall-table-wrap"><table class="recall-table">
    <thead><tr><th style="width:38%">内容</th><th>时间</th><th>响应时间</th><th>测试人员</th></tr></thead>
    <tbody>${logs.map((l, i) => `<tr class="${r.activeIdx === i ? 'on' : ''}" onclick="loadRecallHistory(${i})">
      <td><div class="c" title="${esc(l.q)}">${esc(l.q)}</div></td>
      <td style="white-space:nowrap">${esc(l.time)}</td>
      <td style="white-space:nowrap">${l.cost.toFixed(2)}ms</td>
      <td>${esc(l.by)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function recallItemHTML(c) {
  const simPct = Math.round(c.score * 100);
  const st = (current().cfg.chunk && current().cfg.chunk.strategy) || '自动';
  const strategyLabel = st === '自动' ? '按标题切分' : st;
  return `<div class="recall-item">
    <div class="recall-item-top">
      <span class="recall-sim">相似度 <b>${simPct}%</b></span>
      <span class="recall-sim-bar"><i style="width:${Math.max(simPct, 4)}%"></i></span>
      ${c.parent ? `<span class="recall-parent" data-tip="父分块" onclick="openParentChunk('${esc(c.fileId)}',${c.chunkNo || 1})">${icon('i-layers', 'ic sm')}</span>` : ''}
      <span class="recall-fixed">${esc(strategyLabel)}</span>
    </div>
    <div class="recall-text">${esc(c.text)}</div>
    <div class="recall-item-foot">
      <span class="fimg ${c.type}">${c.type === 'image' ? 'IMG' : c.type.toUpperCase()}</span>
      <span class="nm" title="${esc(c.file)}">${esc(c.file)}</span>
      <span class="go" onclick="recallGoto('${esc(c.fileId)}')">查看${icon('i-chev', 'ic sm')}</span>
    </div>
  </div>`;
}

/* 父分块：查看分块所属父块上下文 */
function openParentChunk(fileId, chunkNo) {
  const k = current();
  const f = k && k.files.find(x => x.id === fileId);
  if (!f) return;
  const idx = Math.max(0, (chunkNo || 1) - 1);
  let parent = '', text = '';
  if (f.chunks && f.chunks.length) {
    if (!f.chunks[0].parent) buildChunks(f);
    const c = f.chunks[idx] || f.chunks[0];
    parent = c.parent || '';
    text = c.text || '';
  }
  const body = parent || (text ? text + '\n\n（该分块未单独生成父块，以上为分块原文）' : '该分块暂无父块上下文。');
  $('#parentChunkBox').innerHTML = `
    <div class="modal-head">
      <span class="fd-panel-title" style="gap:8px">${icon('i-doc', 'ic sm')}查看父块上下文（片段 ${idx + 1}）</span>
      <div class="spacer"></div>
      <button class="modal-close" onclick="closeMask('parentChunkModal')">${icon('i-x', 'ic')}</button>
    </div>
    <div class="modal-body">
      <div class="parent-chunk-box">${esc(body)}</div>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn" onclick="closeMask('parentChunkModal')">关闭</button>
    </div>`;
  openMask('parentChunkModal');
}

/* ---------- 交互 ---------- */
function recallTime(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function recallOnInput(v) {
  recallState(current()).q = v;
}
function recallToggleCancel(v) {
  const btn = $('#recallCancel');
  if (btn) btn.classList.toggle('hidden', !String(v || '').trim());
}
function clearRecallInput() {
  const el = $('#recallInput');
  if (el) { el.value = ''; el.focus(); }
  recallState(current()).q = '';
  recallToggleCancel('');
}
function runRecallTest() {
  const k = current();
  const r = recallState(k);
  const q = ($('#recallInput') ? $('#recallInput').value : '').trim();
  if (!q) { toast('请输入要测试的文本', 'warn'); return; }
  r.q = q;
  const results = recallSearch(k, q);
  const cost = +(880 + Math.random() * 3200).toFixed(2);
  r.results = results;
  r.emptyTip = results.length ? '' : '未召回匹配内容，可换一种表述或调低检索阈值';
  r.history.unshift({ q, time: recallTime(new Date()), cost, by: '孙礼飞', results });
  if (r.history.length > 20) r.history.length = 20;
  r.activeIdx = 0;
  renderTabBody();
  toast(results.length ? `召回 ${results.length} 个分块，耗时 ${cost.toFixed(2)}ms` : '未召回匹配内容', results.length ? 'ok' : 'warn');
}
function loadRecallHistory(i) {
  const r = recallState(current());
  const rec = r.history[i];
  if (!rec) return;
  r.activeIdx = i;
  r.q = rec.q;
  r.results = rec.results;
  r.emptyTip = rec.results.length ? '' : '该记录没有召回结果';
  renderTabBody();
}

/* ============================================================
   召回测试：检索策略设置弹窗
============================================================ */
function recallStrategy(k) {
  const r = recallState(k);
  r.strategy = Object.assign({
    vectorTopK: (k.cfg.retrieval && k.cfg.retrieval.vectorTopK) || 10,
    keywordThreshold: (k.cfg.retrieval && k.cfg.retrieval.keywordThreshold) || 0.3,
    vectorThreshold: (k.cfg.retrieval && k.cfg.retrieval.vectorThreshold) || 0.5,
    rerankOn: !!(k.cfg.retrieval && k.cfg.retrieval.rerank),
    rerank: (k.cfg.retrieval && k.cfg.retrieval.rerankModel) || 'qwen3-rerank',
    rerankTopK: (k.cfg.retrieval && k.cfg.retrieval.rerankTopK) || 5,
    rerankThreshold: (k.cfg.retrieval && k.cfg.retrieval.rerankThreshold) || 0.2
  }, r.strategy || {});
  return r.strategy;
}

function openRecallStrategy() {
  const k = current();
  const st = recallStrategy(k);
  const s = (id, min, max, step, val, field, digits) =>
    setRangeHTML(id, min, max, step, val, `state.recall.byKb['${k.id}'].strategy.${field}=+this.value`, digits);

  $('#recallStrategyBox').innerHTML = `
    <div class="modal-head"><b>检索策略</b><span class="sub">${esc(k.name)}</span>
      <div class="spacer"></div>
      <button class="modal-close" onclick="closeMask('recallStrategy')">${icon('i-x', 'ic')}</button>
    </div>
    <div class="modal-body">
      <div class="wiz-pane-sub" style="margin:-4px 0 4px">配置召回数量与相关性阈值，以及检索结果的重排方式</div>

      <div class="set-list">
        <div class="set-row">
          <div class="txt"><b>向量召回数量</b><i>向量检索返回的最大结果数量</i></div>
          <div class="ctl"><input class="input" id="rsTopK" type="number" min="0" max="100" value="${st.vectorTopK}"
            oninput="state.recall.byKb['${k.id}'].strategy.vectorTopK=+this.value"></div>
        </div>
        <div class="set-row">
          <div class="txt"><b>关键词阈值</b><i>关键词检索的最低相关性分数</i></div>
          <div class="ctl">${s('rsKTh', 0, 1, 0.01, st.keywordThreshold, 'keywordThreshold', 2)}</div>
        </div>
        <div class="set-row">
          <div class="txt"><b>向量阈值</b><i>向量检索的最低相似度分数</i></div>
          <div class="ctl">${s('rsVTh', 0, 1, 0.01, st.vectorThreshold, 'vectorThreshold', 2)}</div>
        </div>
      </div>

      <div class="set-head">
        <div class="txt">
          <b>重排序</b>
          <i>对召回结果进行二次排序，提高回答准确性。启用后需配置重排数量、阈值与模型。</i>
        </div>
        <span class="switch green ${st.rerankOn ? 'on' : ''}" onclick="toggleRecallRerank()"></span>
      </div>

      ${st.rerankOn ? `<div class="set-group">
        <div class="set-row">
          <div class="txt"><b>ReRank 模型<span class="req">*</span></b><i>用于对知识库检索结果进行重排序，提高回答准确性</i></div>
          <div class="ctl">
            <select class="select" id="rsRerank" onchange="state.recall.byKb['${k.id}'].strategy.rerank=this.value">
              <option value="">请选择重排序模型</option>
              <option ${st.rerank === 'qwen3-rerank' ? 'selected' : ''}>qwen3-rerank</option>
              <option ${st.rerank === 'bge-reranker-v2-m3' ? 'selected' : ''}>bge-reranker-v2-m3</option>
            </select>
          </div>
        </div>
        <div class="set-row">
          <div class="txt"><b>重排数量</b><i>重排序后保留的最大结果数量</i></div>
          <div class="ctl"><input class="input" id="rsRerankTopK" type="number" min="0" max="100" value="${st.rerankTopK}"
            oninput="state.recall.byKb['${k.id}'].strategy.rerankTopK=+this.value"></div>
        </div>
        <div class="set-row">
          <div class="txt"><b>重排阈值</b><i>重排序的最低相关性分数</i></div>
          <div class="ctl">${s('rsRTh', -10, 10, 0.1, st.rerankThreshold, 'rerankThreshold', 2)}</div>
        </div>
      </div>` : ''}
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn" onclick="closeMask('recallStrategy')">取消</button>
      <button class="btn primary" onclick="saveRecallStrategy()">保存</button>
    </div>`;
  openMask('recallStrategy');
}
function toggleRecallRerank() {
  const k = current();
  const st = recallStrategy(k);
  st.rerankOn = !st.rerankOn;
  openRecallStrategy();
}
function saveRecallStrategy() {
  const k = current();
  const st = recallStrategy(k);
  if (st.rerankOn && !st.rerank) { toast('请选择 ReRank 模型', 'err'); return; }
  k.cfg.retrieval.vectorTopK = Math.max(0, Math.min(100, +st.vectorTopK || 0));
  k.cfg.retrieval.keywordThreshold = +st.keywordThreshold;
  k.cfg.retrieval.vectorThreshold = +st.vectorThreshold;
  k.cfg.retrieval.rerank = !!st.rerankOn;
  k.cfg.retrieval.rerankModel = st.rerank;
  k.cfg.retrieval.rerankTopK = Math.max(0, Math.min(100, +st.rerankTopK || 0));
  k.cfg.retrieval.rerankThreshold = +st.rerankThreshold;
  closeMask('recallStrategy');
  toast('检索策略已保存，后续测试按新策略执行');
}

/* 简易召回：按关键词命中数给分，返回前 N 个分块 */
function recallSearch(k, q, onlyFiles) {
  const st = recallStrategy(k);
  const terms = q.split(/[\s,，。；;、？！]+/).filter(t => t.length > 0);
  const pool = [];
  const scope = Array.isArray(onlyFiles) ? onlyFiles : (onlyFiles ? [onlyFiles] : k.files);
  scope.forEach(f => {
    if (f.status !== '解析完成' && f.status !== '索引中') return;
    if (!f.chunks || !f.chunks.length) buildChunks(f);
    f.chunks.forEach((c, ci) => pool.push({ file: f.name, fileId: f.id, type: f.type, text: c.text, parent: c.parent || '', chunkNo: ci + 1 }));
  });
  if (!pool.length) {
    k.files.forEach(f => pool.push({
      file: f.name, fileId: f.id, type: f.type,
      text: f.summary || `《${f.name.replace(/[\.][^.]+$/, '')}》相关正文内容。`,
      parent: f.summary || `《${f.name.replace(/[\.][^.]+$/, '')}》的完整上下文内容。`,
      chunkNo: 1
    }));
  }

  const kwTh = Math.max(0, Math.min(1, +st.keywordThreshold));
  const vecTh = Math.max(0, Math.min(1, +st.vectorThreshold));
  const scored = pool.map((c, i) => {
    const hit = terms.filter(t => c.text.includes(t)).length;
    const kwScore = terms.length ? hit / terms.length : 0;
    const vecScore = Math.min(0.97, 0.42 + kwScore * 0.45 + ((i * 37) % 13) / 100);
    const score = +(vecScore * 0.7 + kwScore * 0.3).toFixed(4);
    return { ...c, score, pass: kwScore >= kwTh || vecScore >= vecTh };
  }).filter(c => c.pass);

  scored.sort((a, b) => b.score - a.score);
  let out = scored.slice(0, Math.max(1, Math.min(100, +st.vectorTopK || 10)));

  // 重排序：保留前 rerankTopK 条且分数不低于阈值
  if (st.rerankOn) {
    const rth = Math.max(-10, Math.min(10, +st.rerankThreshold));
    out = out.filter(c => c.score >= rth).slice(0, Math.max(1, Math.min(100, +st.rerankTopK || 5)));
  }
  return out;
}

function recallGoto(fileId) {
  if (!fileId) return;
  state.tab = 'files';
  state.fileQ = '';
  state.page = 1;
  state.selected.clear();
  renderDetail();
  openFileDetail(fileId);
}

</script>
