<svg viewBox="0 0 680 420" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">自定义技能从个人到企业的完整生命周期</text>

  <!-- Phase labels -->
  <text x="44" y="62" font-size="12" font-weight="500" fill="#5F5E5A">个人阶段</text>


  <!-- Dashed phase separators -->
  <line x1="40" y1="195" x2="640" y2="195" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="40" y1="295" x2="640" y2="295" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="40" y1="415" x2="640" y2="415" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4,3"/>

  <!-- Node 1: 个人自定义 -->
  <g>
    <rect x="160" y="75" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="260" y="95" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">个人自定义技能</text>
    <text x="260" y="115" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">~/skills/</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="260" y1="131" x2="260" y2="230" class="arr" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="178" font-size="11" fill="#5F5E5A">提交审核</text>

  <!-- Node 2: 审核中 -->
  <g>
    <rect x="160" y="240" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="260" y="260" text-anchor="middle" font-size="14" font-weight="500" fill="#633806" dominant-baseline="central">审核中</text>
    <text x="260" y="280" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">等待企业管理员审批</text>
  </g>

  <!-- Decision diamond -->
  <g transform="translate(260, 355)">
    <polygon points="0,-30 60,0 0,30 -60,0" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">审核结果</text>
  </g>

  <!-- Arrow 2→Decision -->
  <line x1="260" y1="296" x2="260" y2="323" class="arr" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow Decision→Approved (right) -->
  <line x1="320" y1="355" x2="430" y2="355" class="arr" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="347" font-size="12" font-weight="500" fill="#0F6E56">通过</text>

  <!-- Arrow Decision→Rejected (left) -->
  <line x1="200" y1="355" x2="90" y2="355" class="arr" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="347" font-size="12" font-weight="500" fill="#A32D2D">驳回</text>

  <!-- Node 3a: 审核驳回 -->
  <g>
    <rect x="40" y="335" width="50" height="40" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
    <text x="65" y="358" text-anchor="middle" font-size="12" font-weight="500" fill="#791F1F" dominant-baseline="central">驳回</text>
  </g>
  <!-- Arrow back to personal -->
  <path d="M65 335 L65 103 L158 103" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="75" y="220" font-size="11" fill="#A32D2D">退回个人</text>
  <text x="75" y="234" font-size="11" fill="#A32D2D">可修改后重提</text>

  <!-- Node 3b: 审核通过 → 企业自定义 -->
  <g>
    <rect x="440" y="330" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="540" y="350" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C" dominant-baseline="central">企业技能</text>
    <text x="540" y="370" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">类型: 企业技能 | 状态: 已启用</text>
  </g>




  <!-- Info box: 审核中关键说明 -->
  <g>
    <rect x="400" y="75" width="240" height="100" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="3,2"/>
    <text x="420" y="97" font-size="12" font-weight="500" fill="#633806">审核中阶段的关键点:</text>
    <text x="420" y="117" font-size="12" fill="#5F5E5A">- 技能仍属于个人，仅自己可用</text>
    <text x="420" y="137" font-size="12" fill="#5F5E5A">- 其他企业成员不可见</text>
    <text x="420" y="157" font-size="12" fill="#5F5E5A">- 管理员审核功能/安全/合规</text>
  </g>

</svg>
