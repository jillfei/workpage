<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>OmniX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── 导航图标统一尺寸调小 ── */
        .sidebar-nav .nav-icon {
            display: inline-block;
            flex-shrink: 0;
            font-size: 12px;       /* 从 18px 调小至 14px */
            line-height: 1;
            text-align: center;
			margin-top:-2px;
        }

		.gray-icon {
            /* 使 Emoji 变为灰色 */
            filter: grayscale(100%);
            opacity: 0.8;
            color: #6b7280;  /* 对部分 Unicode 符号生效，Emoji 由 filter 控制 */
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f9fafb;
            color: #1f2937;
        }

        .layout-shell {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ══════════════════════════════
           左侧侧边导航栏  200px 固定
        ══════════════════════════════ */
        .sidebar {
            width: 200px;
            flex-shrink: 0;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Logo 区 */
        .sidebar-logo {
            padding: 18px 16px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f3f4f6;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            color: #fff;
        }

        .logo-title {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.3px;
        }

        .logo-badge {
            font-size: 9px;
            font-weight: 600;
            background: #111827;
            color: #fff;
            padding: 1px 5px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 8px;
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-nav::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 4px;
        }

        .nav-group-label {
            font-size: 10px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 10px 8px 4px;
        }

        .nav-group-label:first-child {
            padding-top: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 8px;
            border-radius: 8px;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        .nav-item:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .nav-item.active {
            background: #eff6ff;
            color: #2563eb;
            font-weight: 500;
            border: 1px solid #bfdbfe;
        }


        .nav-item.planning {
            cursor: default;
            color: #b0b8c4;
        }


        .nav-item.planning:hover {
            background: transparent;
            color: #b0b8c4;
        }



        .nav-item.planning .planning-badge {
            display: inline-block;
            font-size: 8px;
            font-weight: 600;
            color: #a0aec0;
            background: #f1f3f5;
            padding: 0 6px;
            border-radius: 3px;
            line-height: 16px;
            margin-left: auto;
            flex-shrink: 0;
            letter-spacing: 0.3px;
            border: 1px solid #e9edf0;
        }

        .sidebar-footer {
            padding: 12px 14px;
            border-top: 1px solid #e5e7eb;
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            object-fit: cover;
            flex-shrink: 0;
        }

        .user-meta {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-size: 12px;
            font-weight: 500;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-email {
            font-size: 11px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-btn {
            color: #9ca3af;
            cursor: pointer;
            transition: color 0.15s;
            flex-shrink: 0;
            font-size: 14px;    /* 与菜单图标大小一致 */
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }



        .logout-btn:hover {
            color: #2563eb;
        }

        /* ══════════════════════════════
           右侧主内容区域 — iframe 铺满
        ══════════════════════════════ */
        .content-area {
            flex: 1;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #f9fafb;
        }

        .iframe-loader {
            position: absolute;
            inset: 0;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .iframe-loader.visible {
            opacity: 1;
            pointer-events: all;
        }

        .loader-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="layout-shell">

        <!-- ══════════════════════════════════════
             左侧固定侧边导航栏  (200px)
        ══════════════════════════════════════ -->
        <aside class="sidebar">

            <!-- Logo -->
            <div class="sidebar-logo">
                <div class="logo-icon">🚀</div>
                <span class="logo-title">OmniX</span>
                <span class="logo-badge">SVITE</span>
            </div>

            <!-- 菜单导航 -->
            <nav class="sidebar-nav" id="sideNav">

                <!-- ─── 企业智能体 ─── -->
                <div class="nav-group-label">企业智能体</div>

                <a class="nav-item" data-src="./qyznt/zjgl.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">🤖</span>
                    <span>专家管理</span>
                </a>
                <a class="nav-item" data-src="./qyznt/zjtgl.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">👥</span>
                    <span>专家团管理</span>
                </a>
                <a class="nav-item planning" data-planning="true" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">📊</span>
                    <span>智能体评测</span>
                </a>
                <a class="nav-item planning" data-planning="true" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">👁️</span>
                    <span>Agent观测</span>
                </a>
                <a class="nav-item planning" data-planning="true" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">☁️</span>
                    <span>智能体云端</span>
                </a>

                <div class="nav-group-label">资源管理</div>

                <a class="nav-item planning" data-planning="true" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">🧠</span>
                    <span>模型管理</span>
                </a>
                <a class="nav-item planning" data-planning="true" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">🔌</span>
                    <span>MCP管理</span>
                </a>
                <a class="nav-item" data-src="./zygl/jngl.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">⚙️</span>
                    <span>技能管理</span>
                </a>
                <a class="nav-item" data-src="./zygl/zjck.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">📚</span>
                    <span>专家词库</span>
                </a>
                <a class="nav-item planning" data-planning="true" data-src="./agent-content.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">🗂️</span>
                    <span>企业知识库</span>
                </a>

                <!-- ─── 企业管理 ─── -->
                <div class="nav-group-label">企业管理</div>

                <a class="nav-item" data-src="./qygl/qycy.html" onclick="navigate(this)" id="navAgent">
                    <span class="nav-icon gray-icon">👤</span>
                    <span>用户管理</span>
                </a>
                <a class="nav-item" data-src="./qygl/bmgl.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">🏢</span>
                    <span>部门管理</span>
                </a>
                <a class="nav-item planning" data-planning="true" data-src="./qygl/jsqx.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">🔑</span>
                    <span>角色权限</span>
                </a>
                <a class="nav-item planning" data-planning="true" data-src="./qygl/cdgl.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">📋</span>
                    <span>菜单管理</span>
                </a>
                <a class="nav-item planning" data-planning="true" data-src="./mcp.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">🎨</span>
                    <span>品牌设置</span>
                </a>
                <a class="nav-item planning" data-planning="true" data-src="./mcp.html" onclick="navigate(this)">
                    <span class="nav-icon gray-icon">🔄</span>
                    <span>组织架构同步</span>
                </a>

                <!-- ─── 版本管理 ─── -->
                <div class="nav-group-label">版本管理</div>

                <a class="nav-item active" data-src="./changelog.html" onclick="navigate(this)">
                    <span class="nav-icon">📜</span>
                    <span>版本日志</span>
                </a>

            </nav>

            <!-- 底部用户信息 -->
            <div class="sidebar-footer">
                <div class="user-info">
                    <img class="user-avatar"
                    src="https://modao.cc/agent-py/media/generated_images/2026-05-27/17718e76067f4762a85e4e89249784e8.jpg"
                    alt="用户头像" />
                    <div class="user-meta">
                        <p class="user-name">管理员 孙礼飞</p>
                        <p class="user-email">slf-31338@zhink.cc</p>
                    </div>
                    <button class="logout-btn" title="退出登录">
                        <span class="nav-icon">🚪</span>
                    </button>
                </div>
            </div>

        </aside>

        <!-- ══════════════════════════════════════
             右侧主内容区域 — 铺满 iframe
        ══════════════════════════════════════ -->
        <div class="content-area">
            <!-- 加载遮罩 -->
            <div class="iframe-loader" id="iframeLoader">
                <div class="loader-spinner"></div>
            </div>

            <!-- 内容 iframe：默认加载版本日志 -->
            <iframe id="mainFrame" class="content-iframe" src="./changelog.html" title="内容区域">
            </iframe>
        </div>

    </div>

    <script>
        const frame = document.getElementById('mainFrame');
        const loader = document.getElementById('iframeLoader');

        function navigate(el) {
            if (el.dataset.planning === 'true') {
                return;
            }

            const src = el.dataset.src;
            if (!src) return;

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');

            loader.classList.add('visible');
            frame.src = src;
        }

        frame.addEventListener('load', () => {
            loader.classList.remove('visible');
        });

        frame.addEventListener('error', () => {
            loader.classList.remove('visible');
        });
    </script>

</body>
</html>
