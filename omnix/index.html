<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>OmniX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .nav-icon {
            display: inline-block;
            flex-shrink: 0;
            width: 17px;
            height: 17px;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f9fafb;
            color: #1f2937;
        }

        /* ── 外层布局容器 ── */
        .layout-shell {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ══════════════════════════════
           左侧侧边导航栏  200px 固定
        ══════════════════════════════ */
        .sidebar {
            width: 200px;
            flex-shrink: 0;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Logo 区 */
        .sidebar-logo {
            padding: 18px 16px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f3f4f6;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-title {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.3px;
        }

        .logo-badge {
            font-size: 9px;
            font-weight: 600;
            background: #111827;
            color: #fff;
            padding: 1px 5px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* 导航菜单滚动区 */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 8px;
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-nav::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 4px;
        }

        /* 菜单分组标题 */
        .nav-group-label {
            font-size: 10px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 10px 8px 4px;
        }

        .nav-group-label:first-child {
            padding-top: 6px;
        }

        /* ── 菜单项基础 ── */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 8px;
            border-radius: 8px;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        .nav-item .nav-icon {
            font-size: 17px;
            flex-shrink: 0;
            color: #6b7280;
            transition: color 0.15s;
        }

        .nav-item:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .nav-item:hover .nav-icon {
            color: #374151;
        }

        /* 激活状态 */
        .nav-item.active {
            background: #eff6ff;
            color: #2563eb;
            font-weight: 500;
            border: 1px solid #bfdbfe;
        }

        .nav-item.active .nav-icon {
            color: #2563eb;
        }

        /* ── 待规划菜单项 ── */
        .nav-item.planning {
            cursor: default;
            color: #b0b8c4;
        }

        .nav-item.planning .nav-icon {
            color: #c5cdd8;
        }

        .nav-item.planning:hover {
            background: transparent;
            color: #b0b8c4;
        }

        .nav-item.planning:hover .nav-icon {
            color: #c5cdd8;
        }

        .nav-item.planning .planning-badge {
            display: inline-block;
            font-size: 8px;
            font-weight: 600;
            color: #a0aec0;
            background: #f1f3f5;
            padding: 0 6px;
            border-radius: 3px;
            line-height: 16px;
            margin-left: auto;
            flex-shrink: 0;
            letter-spacing: 0.3px;
            border: 1px solid #e9edf0;
        }

        .nav-item.planning{
            color: #b0b8c4;
        }

        /* 底部用户区 */
        .sidebar-footer {
            padding: 12px 14px;
            border-top: 1px solid #e5e7eb;
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            object-fit: cover;
            flex-shrink: 0;
        }

        .user-meta {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-size: 12px;
            font-weight: 500;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-email {
            font-size: 11px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-btn {
            color: #9ca3af;
            cursor: pointer;
            transition: color 0.15s;
            flex-shrink: 0;
            font-size: 17px;
            background: none;
            border: none;
        }

        .logout-btn:hover {
            color: #2563eb;
        }

        /* ══════════════════════════════
           右侧主内容区域 — iframe 铺满
        ══════════════════════════════ */
        .content-area {
            flex: 1;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #f9fafb;
        }

        /* iframe 加载遮罩 */
        .iframe-loader {
            position: absolute;
            inset: 0;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .iframe-loader.visible {
            opacity: 1;
            pointer-events: all;
        }

        .loader-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

    <script>
        const frame = document.getElementById('mainFrame');
        const loader = document.getElementById('iframeLoader');

        function navigate(el) {
            if (el.dataset.planning === 'true') {
                return;
            }

            const src = el.dataset.src;
            if (!src) return;

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');

            loader.classList.add('visible');
            frame.src = src;
        }

        frame.addEventListener('load', () => {
            loader.classList.remove('visible');
        });

        frame.addEventListener('error', () => {
            loader.classList.remove('visible');
        });
    </script>
