<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1:1 还原模板（按源图尺寸替换）</title>
<style>
  /* ===== 设计令牌：颜色来自 analyze_image.py 的 palette / --points 取色 ===== */
  :root{
    --bg:#F5F6FA; --surface:#FFFFFF;
    --primary:#2F6BFF; --primary-ink:#FFFFFF;
    --text:#1A1A1A; --text-sub:#8A8F99; --text-faint:#B7BCC4;
    --border:#E5E7EB; --border-strong:#D0D5DD;
    --radius-s:6px; --radius-m:10px; --radius-l:16px;
    --shadow-card:0 2px 8px rgba(17,24,39,.06);
    /* 仅系统字体栈，禁用 fonts.googleapis.com */
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  /* ===== 画布：width/height 改为 analyze_image.py 输出的源图尺寸 ===== */
  .canvas{
    position:relative;
    width:1440px;   /* TODO: 替换为源图 width */
    height:900px;   /* TODO: 替换为源图 height */
    margin:0 auto;
    background:var(--bg);
    font-family:var(--font-sans);
    color:var(--text);
    overflow:hidden;
  }

  /* ===== 示例组件（删掉，按源图绝对定位重写） ===== */
  .nav{ position:absolute; left:0; top:0; width:1440px; height:56px;
    background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 24px; gap:20px; }
  .nav .logo{ font-weight:700; font-size:18px; color:var(--primary); }
  .nav .item{ font-size:14px; color:var(--text-sub); cursor:pointer; }
  .nav .item.active{ color:var(--text); font-weight:600; }

  .btn{ position:absolute; display:inline-flex; align-items:center; justify-content:center;
    height:40px; padding:0 20px; border-radius:var(--radius-m);
    background:var(--primary); color:var(--primary-ink); font-size:14px; font-weight:600;
    border:none; cursor:pointer; }
</style>
</head>
<body>
  <div class="canvas">
    <!-- 顶部导航示例 -->
    <div class="nav">
      <span class="logo">Logo</span>
      <span class="item active">首页</span>
      <span class="item">产品</span>
      <span class="item">关于</span>
    </div>

    <!-- 主按钮示例：left/top/width/height 按标尺对齐源图 -->
    <button class="btn" style="left:120px;top:120px;">主要操作</button>

    <!-- 照片占位示例：替换为真实图路径/尺寸 -->
    <!-- TODO: 此处替换为真实图：assets/banner.png，建议 1200x400 -->
    <div class="ph" style="position:absolute;left:120px;top:200px;width:1200px;height:400px;
      background:repeating-linear-gradient(45deg,#EEE,#EEE 10px,#E3E3E3 10px,#E3E3E3 20px);
      display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:12px;">
      图片占位 1200×400
    </div>
  </div>

  <script>
    /* 轻交互示例（原生 JS，不引库）。按需增删。 */
    document.querySelectorAll('.nav .item').forEach(function(el){
      el.addEventListener('click', function(){
        document.querySelectorAll('.nav .item').forEach(function(n){n.classList.remove('active');});
        el.classList.add('active');
      });
    });
  </script>
</body>
</html>
