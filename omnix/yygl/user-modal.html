<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择用户 - 深层级组织架构单选弹窗</title>
<style>
  :root{
    --primary:#2563eb; --primary-light:#eff6ff;
    --border:#e5e7eb; --text:#1f2937; --text-2:#6b7280; --text-3:#9ca3af;
    --bg:#f3f4f6; --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body{background:#d7dce3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

  /* ===== 演示触发按钮 ===== */
  .demo-open-btn{padding:10px 22px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}

  /* ===== 弹窗 ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s}
  .modal-mask.show{opacity:1;pointer-events:auto}
  .modal{width:860px;max-width:96vw;height:620px;max-height:92vh;background:#fff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25);transform:translateY(8px) scale(.98);transition:transform .18s}
  .modal-mask.show .modal{transform:none}

  /* 头部：标题 + 搜索 */
  .modal-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .head-title{font-size:16px;font-weight:600;color:var(--text)}
  .head-close{border:none;background:none;font-size:20px;color:var(--text-3);cursor:pointer;line-height:1;padding:4px}
  .head-close:hover{color:var(--text)}
  .search-wrap{position:relative;margin-top:12px}
  .search-input{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 34px 0 36px;font-size:14px;outline:none;background:var(--bg)}
  .search-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--text-3);cursor:pointer;font-size:14px;display:none}

  /* 主体：左树 + 右成员 */
  .modal-body{flex:1;display:flex;min-height:0;position:relative}
  .tree-pane{width:280px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:8px 6px}
  .member-pane{flex:1;overflow-y:auto;padding:12px 16px;min-width:0}

  /* 面包屑（右侧顶部，显示当前部门完整路径 —— 深层级关键） */
  .crumb{font-size:12px;color:var(--text-2);padding:2px 2px 10px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;line-height:1.7}
  .crumb a{color:var(--primary);cursor:pointer;text-decoration:none}
  .crumb a:hover{text-decoration:underline}
  .crumb .sep{color:var(--text-3);margin:0 2px}

  /* 树节点 */
  .tree-node{user-select:none}
  .tree-row{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--text);white-space:nowrap}
  .tree-row:hover{background:var(--bg)}
  .tree-row.active{background:var(--primary-light);color:var(--primary);font-weight:500}
  .arrow{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-3);transition:transform .15s;border-radius:4px}
  .arrow:hover{background:#e5e7eb;color:var(--text)}
  .arrow.open{transform:rotate(90deg)}
  .arrow.leaf{visibility:hidden}
  .dept-name{overflow:hidden;text-overflow:ellipsis}
  .dept-count{margin-left:auto;font-size:11px;color:var(--text-3);padding-left:6px}
  .tree-children{margin-left:16px;border-left:1px dashed #e2e5ea;padding-left:4px}
  .tree-loading{font-size:12px;color:var(--text-3);padding:5px 8px 5px 28px}

  /* 成员行（单选） */
  .member-title{font-size:12px;color:var(--text-3);margin:0 2px 8px}
  .member-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .member-row:hover{background:var(--bg)}
  .member-row.selected{background:var(--primary-light);border-color:rgba(37,99,235,.35)}
  .radio{width:16px;height:16px;border:1.5px solid #c4c9d2;border-radius:50%;flex-shrink:0;position:relative;background:#fff}
  .member-row.selected .radio{border-color:var(--primary)}
  .member-row.selected .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
  .avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:500}
  .member-info{min-width:0;flex:1}
  .member-name{font-size:14px;color:var(--text);font-weight:500;display:flex;align-items:center;gap:6px}
  .member-name .post{font-size:11px;color:var(--text-3);font-weight:400}
  .member-path{font-size:12px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty-tip{text-align:center;color:var(--text-3);font-size:13px;padding:48px 0}

  /* 搜索结果面板（覆盖主体） */
  .search-panel{position:absolute;inset:0;background:#fff;z-index:5;overflow-y:auto;padding:12px 16px;display:none}
  .search-panel.show{display:block}
  .search-hint{font-size:12px;color:var(--text-3);padding:2px 2px 10px}
  .search-hint b{color:var(--text-2)}
  mark{background:#fef08a;color:inherit;border-radius:2px;padding:0 1px}

  /* 底部 */
  .modal-foot{flex-shrink:0;border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px}
  .selected-box{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
  .selected-chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);border-radius:14px;padding:4px 10px;font-size:13px;max-width:100%}
  .selected-chip .x{cursor:pointer;font-style:normal;opacity:.7}
  .selected-chip .x:hover{opacity:1}
  .btn{padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text)}
  .btn:hover{border-color:#c9ced6}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:#1d4fd8}
  .btn-primary:disabled{background:#a5b9f0;border-color:#a5b9f0;cursor:not-allowed}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#d3d7de;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#bcc1ca}
</style>
</head>
<body>

<button class="demo-open-btn" id="openBtn">选择用户</button>

<div class="modal-mask" id="mask">
  <div class="modal" role="dialog" aria-modal="true" aria-label="选择用户">
    <div class="modal-head">
      <div class="head-row">
        <div class="head-title">选择用户（单选）</div>
        <button class="head-close" id="closeBtn" aria-label="关闭">✕</button>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" type="text"
               placeholder="搜索姓名 / 手机号 / 部门，深层级组织建议直接搜人" autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="清空">✕</button>
      </div>
    </div>

    <div class="modal-body">
      <div class="tree-pane" id="treePane"></div>
      <div class="member-pane" id="memberPane"></div>
      <div class="search-panel" id="searchPanel"></div>
    </div>

    <div class="modal-foot">
      <div class="selected-box" id="selectedBox"><span style="color:var(--text-3)">未选择用户</span></div>
      <button class="btn" id="cancelBtn">取 消</button>
      <button class="btn btn-primary" id="okBtn" disabled>确 定</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
 * 1. 模拟深层级组织数据（7 级：集团→事业部→中心→部门→科室→小组→成员）
 *    实际项目中替换为接口：
 *    GET /api/dept/children?deptId=xxx   （懒加载子部门）
 *    GET /api/dept/users?deptId=xxx      （部门成员）
 *    GET /api/user/search?kw=xxx         （全局搜索）
 * ========================================================= */
const LEVEL_NAMES = ["事业部","中心","部门","科室","小组"];
const DEPT_PREFIX = ["华东","华南","华北","西南","研发","产品","市场","销售","交付","运营","财务","人力"];
const SURNAMES = "赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦许何吕张孔曹严华金魏陶姜";
const GIVEN = ["伟","芳","娜","敏","静","磊","军","洋","勇","艳","杰","涛","明","超","秀英","霞","平","刚","桂英","文博","子涵","浩然","欣怡","俊杰"];
const POSTS = ["总监","经理","主管","专员","工程师","助理"]; // 数据保留，但界面不显示
const AVATAR_COLORS = ["#2563eb","#7c3aed","#db2777","#ea580c","#059669","#0891b2","#4f46e5","#b45309"];

let uid = 1, did = 1;
function rand(n){ return Math.floor(Math.random()*n); }
function makeUser(deptPath, deptId){
  const name = SURNAMES[rand(SURNAMES.length)] + GIVEN[rand(GIVEN.length)];
  // 手机号字段：真实项目由后端返回，这里用模拟号段生成便于预览
  const phone = "1" + [3,5,7,8,9][rand(5)] + String(100000000 + Math.floor(Math.random()*899999999)).slice(0,9);
  return { id:"u"+(uid++), name, empNo:"E"+String(10000+uid), post:POSTS[rand(POSTS.length)], phone,
           deptId, deptPath:deptPath.join(" / "), color:AVATAR_COLORS[rand(AVATAR_COLORS.length)] };
}
// 递归生成部门树，depth 0..6（第 6 级挂人）
function makeDept(name, level, path){
  const node = { id:"d"+(did++), name, level, path:path.concat(name), children:null, users:null, childCount:0 };
  if(level < 6){
    const n = level===0 ? 4 : (level<3 ? 2+rand(3) : 1+rand(3));
    node.children = [];
    for(let i=0;i<n;i++){
      const cname = (level>=4 ? path[path.length-1].slice(0,2) : DEPT_PREFIX[rand(DEPT_PREFIX.length)]) + LEVEL_NAMES[level] + (i+1);
      node.children.push(makeDept(cname, level+1, node.path));
    }
    node.childCount = n;
  }
  // 第 3 级起每层都可能挂人
  if(level >= 3){
    node.users = [];
    const m = 2+rand(6);
    for(let i=0;i<m;i++) node.users.push(makeUser(node.path, node.id));
  }
  return node;
}
const ROOT = makeDept("思维特集团", 0, []);

// 全部用户扁平索引（真实项目由后端搜索接口承担）
const ALL_USERS = [];
(function flatten(d){ (d.users||[]).forEach(u=>ALL_USERS.push(u)); (d.children||[]).forEach(flatten); })(ROOT);
const DEPT_INDEX = {};
(function index(d){ DEPT_INDEX[d.id]=d; (d.children||[]).forEach(index); })(ROOT);

/* =========================================================
 * 2. 弹窗状态与渲染
 * ========================================================= */
const $ = id => document.getElementById(id);
const mask=$("mask"), treePane=$("treePane"), memberPane=$("memberPane"),
      searchInput=$("searchInput"), searchPanel=$("searchPanel"), searchClear=$("searchClear");

let selectedUser = null;   // 单选：全局唯一
let activeDeptId = ROOT.id;
const expanded = new Set([ROOT.id]);

function open(){ mask.classList.add("show"); setTimeout(()=>searchInput.focus(),100); }
function close(){ mask.classList.remove("show"); }
$("openBtn").onclick = open;
$("closeBtn").onclick = $("cancelBtn").onclick = close;
mask.addEventListener("click", e=>{ if(e.target===mask) close(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && mask.classList.contains("show")) close(); });

/* ---- 左侧树（懒加载：children 首次展开时模拟异步请求） ---- */
function renderTree(){
  treePane.innerHTML = "";
  treePane.appendChild(buildNode(ROOT));
}
function buildNode(dept){
  const wrap = document.createElement("div");
  wrap.className = "tree-node";
  const isLeaf = !dept.children;
  const isOpen = expanded.has(dept.id);

  const row = document.createElement("div");
  row.className = "tree-row" + (dept.id===activeDeptId ? " active":"");
  row.innerHTML =
    '<span class="arrow '+(isLeaf?"leaf":(isOpen?"open":""))+'">▶</span>'+
    '<span class="dept-name" title="'+dept.path.join(" / ")+'">'+dept.name+'</span>'+
    (dept.users&&dept.users.length ? '<span class="dept-count">'+dept.users.length+'</span>':'');

  row.querySelector(".arrow").addEventListener("click", e=>{
    e.stopPropagation();
    if(isLeaf) return;
    toggleExpand(dept, wrap);
  });
  row.addEventListener("click", ()=>{
    activeDeptId = dept.id;
    clearSearch();
    renderTree(); renderMembers();
  });
  wrap.appendChild(row);

  if(isOpen && !isLeaf){
    if(dept.children){
      const box = document.createElement("div");
      box.className = "tree-children";
      dept.children.forEach(c=>box.appendChild(buildNode(c)));
      wrap.appendChild(box);
    }else{
      const tip = document.createElement("div");
      tip.className = "tree-loading"; tip.textContent = "加载中…";
      wrap.appendChild(tip);
    }
  }
  return wrap;
}
function toggleExpand(dept, wrap){
  if(expanded.has(dept.id)){ expanded.delete(dept.id); renderTree(); return; }
  expanded.add(dept.id);
  if(dept.children){ renderTree(); return; }
  // 模拟懒加载接口：GET /api/dept/children?deptId=
  renderTree();
  setTimeout(()=>{
    if(!dept.children){ // 演示数据已内置 children，这里模拟一次网络延迟
      const d = DEPT_INDEX[dept.id]; d.children = d.children || [];
    }
    renderTree();
  }, 300);
}

/* ---- 右侧成员面板 ---- */
function renderMembers(){
  const dept = DEPT_INDEX[activeDeptId];
  let html = "";

  // 面包屑：完整路径，可点击回跳任意上级（深层级必备）
  html += '<div class="crumb">';
  dept.path.forEach((p,i)=>{
    const node = findDeptByPath(dept, i);
    html += (i>0 ? '<span class="sep">/</span>':'') +
            '<a data-dept="'+node.id+'">'+p+'</a>';
  });
  html += '</div>';

  // 部门成员（含子部门汇总开关可按需扩展）
  const users = dept.users || [];
  html += '<div class="member-title">部门成员（'+users.length+'）</div>';
  if(!users.length){
    html += '<div class="empty-tip">该部门暂无直属成员，请在左侧部门树中展开下级部门</div>';
  }else{
    users.forEach(u=>{ html += memberRowHtml(u); });
  }
  memberPane.innerHTML = html;
  memberPane.scrollTop = 0;

  memberPane.querySelectorAll("[data-dept]").forEach(el=>{
    el.addEventListener("click", ()=>{
      activeDeptId = el.dataset.dept;
      expandTo(activeDeptId);
      renderTree(); renderMembers();
    });
  });
  memberPane.querySelectorAll("[data-user]").forEach(el=>{
    el.addEventListener("click", ()=>selectUser(ALL_USERS.find(u=>u.id===el.dataset.user) || findUserById(el.dataset.user)));
  });
}
function memberRowHtml(u){
  const sel = selectedUser && selectedUser.id===u.id;
  // 姓名行只显示手机号，不显示职位和工号
  return '<div class="member-row'+(sel?" selected":"")+'" data-user="'+u.id+'">'+
    '<span class="radio"></span>'+
    '<span class="avatar" style="background:'+u.color+'">'+u.name.slice(0,1)+'</span>'+
    '<div class="member-info">'+
      '<div class="member-name">'+u.name+'<span class="post">'+u.phone+'</span></div>'+
      '<div class="member-path" title="'+u.deptPath+'">'+u.deptPath+'</div>'+
    '</div></div>';
}
function findUserById(id){
  let found=null;
  (function walk(d){ if(found)return; (d.users||[]).forEach(u=>{if(u.id===id)found=u;}); (d.children||[]).forEach(walk); })(ROOT);
  return found;
}
function findDeptByPath(dept, upto){
  // 按路径逐级找到对应节点
  let cur = ROOT;
  const target = dept.path.slice(1, upto+1);
  for(const name of target){
    cur = (cur.children||[]).find(c=>c.name===name) || cur;
  }
  return cur;
}
function expandTo(deptId){
  // 展开目标节点的所有祖先
  (function walk(d, chain){
    if(d.id===deptId){ chain.forEach(x=>expanded.add(x)); return true; }
    for(const c of (d.children||[])){
      if(walk(c, chain.concat(d.id))) return true;
    }
    return false;
  })(ROOT, []);
}

/* ---- 单选逻辑 ---- */
function selectUser(u){
  if(!u) return;
  selectedUser = (selectedUser && selectedUser.id===u.id) ? null : u; // 再点一次可取消
  refreshSelectionUI();
  // 局部刷新选中态，避免整面板重绘
  memberPane.querySelectorAll(".member-row").forEach(row=>{
    row.classList.toggle("selected", selectedUser && row.dataset.user===selectedUser.id);
  });
  searchPanel.querySelectorAll(".member-row").forEach(row=>{
    row.classList.toggle("selected", selectedUser && row.dataset.user===selectedUser.id);
  });
}
function refreshSelectionUI(){
  const box=$("selectedBox"), ok=$("okBtn");
  if(selectedUser){
    box.innerHTML = '<span>已选：</span><span class="selected-chip">'+
      '<span class="avatar" style="width:18px;height:18px;font-size:10px;background:'+selectedUser.color+'">'+selectedUser.name.slice(0,1)+'</span>'+
      selectedUser.name+'<i class="x" id="chipX">✕</i></span>';
    $("chipX").onclick = ()=>selectUser(selectedUser);
    ok.disabled = false;
  }else{
    box.innerHTML = '<span style="color:var(--text-3)">未选择用户</span>';
    ok.disabled = true;
  }
}
$("okBtn").onclick = ()=>{
  if(!selectedUser) return;
  // 对外回调：这里演示 alert，实际项目改为 onConfirm(selectedUser)
  alert("已选择用户：\n" + selectedUser.name + "（" + selectedUser.phone + "）\n部门：" + selectedUser.deptPath);
  close();
};

/* ---- 全局搜索（深层级组织的第一入口） ---- */
let searchTimer=null;
searchInput.addEventListener("input", ()=>{
  const kw = searchInput.value.trim();
  searchClear.style.display = kw ? "block":"none";
  clearTimeout(searchTimer);
  if(!kw){ searchPanel.classList.remove("show"); return; }
  searchTimer = setTimeout(()=>doSearch(kw), 200); // 防抖，真实项目走后端搜索接口
});
searchClear.onclick = ()=>{ searchInput.value=""; clearSearch(); searchInput.focus(); };
function clearSearch(){
  searchInput.value=""; searchClear.style.display="none"; searchPanel.classList.remove("show");
}
function doSearch(kw){
  const lower = kw.toLowerCase();
  const hitUsers = ALL_USERS.filter(u =>
    u.name.includes(kw) || u.phone.includes(kw) || u.deptPath.toLowerCase().includes(lower)
  ).slice(0, 50);

  let html = '<div class="search-hint">共找到 <b>'+hitUsers.length+'</b> 位匹配用户'+(hitUsers.length>=50?"（仅显示前 50 条）":"")+'，点击即可选中</div>';
  if(!hitUsers.length){
    html += '<div class="empty-tip">未找到“'+kw+'”相关用户，试试姓名、手机号或部门名</div>';
  }else{
    hitUsers.forEach(u=>{
      html += memberRowHtml(u).replace(u.name, hl(u.name,kw)).replace(u.deptPath, hl(u.deptPath,kw));
    });
  }
  searchPanel.innerHTML = html;
  searchPanel.classList.add("show");
  searchPanel.querySelectorAll("[data-user]").forEach(el=>{
    el.addEventListener("click", ()=>{
      selectUser(findUserById(el.dataset.user));
      if(selectedUser){ // 选中后关闭搜索面板，回到树视图确认
        clearSearch(); renderMembers();
      }
    });
  });
}
function hl(text, kw){
  const i = text.toLowerCase().indexOf(kw.toLowerCase());
  if(i<0) return text;
  return text.slice(0,i)+"<mark>"+text.slice(i,i+kw.length)+"</mark>"+text.slice(i+kw.length);
}

/* ---- 初始化 ---- */
renderTree();
renderMembers();
refreshSelectionUI();
open(); // 打开页面即展示弹窗，方便预览
</script>
</body>
</html>
